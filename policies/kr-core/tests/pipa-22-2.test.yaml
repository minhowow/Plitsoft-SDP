# yaml-language-server: $schema=../../../schemas/policy-test-0.1.json
apiVersion: policypack/test-0.1
rule: kr.pipa.22-2/signup-without-guard
cases:
  - file: pipa-22-2/violating.ts
    note: 생년월일을 받는데 아무 확인 없이 가입시킨다
    expect: needs-review
    ai:
      ai-guard: no
  - file: pipa-22-2/under14-branch.ts
    expect: compliant
  - file: pipa-22-2/password-length.ts
    note: >
      가입 코드의 '< 14' 는 비밀번호 길이 검사다. 연령 분기로 읽으면 안 된다
    decoy-for: [under14-branch]
    expect: needs-review
    ai: {ai-guard: no}
  - file: pipa-22-2/user-agent-length.ts
    note: >
      가입 코드의 '< 14' 는 User-Agent 길이 검사다. 이름 속 age(agent)를 나이로 읽으면 안 된다
    decoy-for: [under14-branch]
    expect: needs-review
    ai: {ai-guard: no}
  - file: pipa-22-2/domain-age.ts
    note: >
      '< 14' 는 이메일 도메인이 생긴 지 며칠인지다(일회용 메일 거르기). 이름 끝의 Age(domainAge)는
      사람의 나이가 아니다
    decoy-for: [under14-branch]
    expect: needs-review
    ai: {ai-guard: no}
  - file: pipa-22-2/age-branch-logs-only.ts
    note: 만 14세 미만이면 기록만 남기고 그대로 가입시킨다. 분기가 막지 않으면 준수가 아니다
    decoy-for: [under14-branch]
    expect: needs-review
    ai: {ai-guard: no}
  - file: pipa-22-2/under14-years.ts
    note: 만 나이를 date-fns 의 differenceInYears 로 재서 years 에 담았다
    expect: compliant
  - file: pipa-22-2/guardian-call.ts
    note: >
      이름만 본 약한 대안(guardian-call)은 혼자 풀지 못한다. 판정자가 보호자 동의 확인 줄을 인용해야 풀린다
    expect: compliant
    ai:
      ai-guard: {answer: yes, cite: 'await verifyGuardianConsent(body.birthDate, body.guardianToken);'}
  - file: pipa-22-2/ai-guard.ts
    note: 정적 대안이 못 알아보는 적법 구현. AI 가 실재하는 줄을 인용해야 해제된다
    expect: compliant
    ai:
      ai-guard:
        answer: yes
        cite: 'if (isMinor(body.birthDate)) return res.status(403).json({ error: "MINOR" });'
  - file: pipa-22-2/no-birth.ts
    expect: not-applicable
  - file: pipa-22-2/cache-header-and-join.ts
    note: Cache-Control 의 max-age 와 배열 .join() 은 가입·나이 신호가 아니다
    expect: not-applicable
  - file: pipa-22-2/lock-file-age.ts
    note: >
      잠금 파일의 나이(const age = Date.now() - mtime), path 의 join, registerCleanup. 파일 전체의 낱말을 보던 적용
      조건이 가입 코드로 읽었다(dev 평가 2026-09-30)
    expect: not-applicable
  - file: pipa-22-2/age-gate-checkbox.tsx
    note: >
      생년월일을 받고, '[필수] 만 14세 이상입니다' 를 체크해야 가입된다. 문구만 본 약한 대안(age-gate-text)은
      혼자 풀지 못한다. 판정자가 가입을 막는 줄을 인용해야 풀린다
    expect: compliant
    ai:
      ai-guard: {answer: yes, cite: 'if (!over14) return;'}
  - file: pipa-22-2/age-gate-checkbox.tsx
    id: pipa-22-2/age-gate-checkbox.tsx#judge-says-no
    note: >
      같은 화면을 판정자가 인정하지 않으면 경고가 남는다. 자기 확인 항목만으로 충분한지는 사람이 정한다
    expect: needs-review
    ai: {ai-guard: no}
  - file: pipa-22-2/terms-sentence-only.ts
    note: >
      약관 문장에만 '만 14세 미만은 가입할 수 없습니다' 라고 적고 가입은 그대로 받는다. 문구는 약한 근거일 뿐이라
      판정자가 막는 처리를 찾지 못하면 경고가 남는다
    expect: needs-review
    ai: {ai-guard: no}
  - file: pipa-22-2/age-gate-only.tsx
    note: >
      나이를 받지 않고 '만 14세 이상입니다' 항목만 둔 가입. 이 규칙은 나이를 받는 가입만 본다(알려진 한계:
      나이를 묻지 않는 가입은 경고하지 않는다). 2026-10-06 까지는 이 문구를 나이 수집으로 세어 경고를 냈다
    expect: not-applicable
  - file: pipa-22-2/join-word-not-signup.ts
    note: >
      알려진 한계(오경보). SQL 조각 "JOIN", 소켓 이벤트 "join"·"register" 와 age 필드. 가입 경로가 아닌데
      낱말 하나짜리 문자열을 가입 경로로 읽는다. 슬래시 없는 경로(@Post("join"))를 놓치지 않으려고 둔 넓이다
    expect: needs-review
    ai: {ai-guard: no}

  # ── 가입 경로 꼴 (2026-10-07 검토에서) ───────────────────────────────────
  - file: pipa-22-2/register-path.ts
    note: 슬래시가 있는 경로 "/register"
    expect: needs-review
    ai: {ai-guard: no}
  - file: pipa-22-2/nest-post-join.ts
    note: NestJS 데코레이터의 경로는 슬래시 없이 적는다(@Post("join"))
    expect: needs-review
    ai: {ai-guard: no}
  - file: pipa-22-2/client-relative-join.ts
    note: 기준 주소(prefixUrl)를 둔 클라이언트의 상대 경로 post("join")
    expect: needs-review
    ai: {ai-guard: no}
  - file: pipa-22-2/register-subpath.ts
    note: 슬래시가 낱말 뒤에만 있는 경로 "register/email"
    expect: needs-review
    ai: {ai-guard: no}

  - file: pipa-22-2/register-route.ts
    note: 가입 경로가 "/api/auth/register" 다. signup 이라는 낱말은 없다
    expect: needs-review
    ai: {ai-guard: no}
  - file: pipa-22-2/join-route.tsx
    note: 가입 요청을 "/members/join" 으로 보낸다
    expect: needs-review
    ai: {ai-guard: no}

  # ── 나이를 받는 모양 ─────────────────────────────────────────────────────────
  - file: pipa-22-2/dob-shorthand.ts
    note: 생년월일을 줄여 쓴 속성 { email, dob } 로 받는다
    expect: needs-review
    ai: {ai-guard: no}
  - file: pipa-22-2/date-of-birth-state.tsx
    note: 생년월일을 상태 변수 dateOfBirth 로 받는다
    expect: needs-review
    ai: {ai-guard: no}
  - file: pipa-22-2/profile-partial-parse.ts
    note: >
      가입과 무관한 프로필 코드이고 파일 일부가 파싱되지 않는다. 가입 낱말이 하나도 없으면 생년 이름(birthday)만으로
      '불확실'이 되면 안 된다
    expect: not-applicable
  - file: pipa-22-2/user-birth.ts
    note: birth 가 이름 앞이 아니라 뒤에 오는 필드(userBirth)를 줄여 쓴 속성으로 받는다
    expect: needs-review
    ai: {ai-guard: no}
  - file: pipa-22-2/dob-parts.ts
    note: 생년월일을 dobYear·dobMonth·dobDay 로 나눠 받는다. dob 로 시작하는 이름이다
    expect: needs-review
    ai: {ai-guard: no}
  - file: pipa-22-2/age-shorthand-notice.tsx
    note: >
      알려진 한계(놓침). 나이를 age 상태와 줄여 쓴 속성({ email, age })으로만 받는다. age 는 필드 선언·문자열·멤버
      접근만 세어서 적용되지 않는다. 2026-10-06 까지는 '만 14세' 문구 때문에 경고가 났다
    expect: not-applicable
  - file: pipa-22-2/birthday-other-function.js
    note: >
      알려진 한계(오경보). 가입 함수와 같은 파일의 프로필 수정이 birthday 를 받는다. 파일 단위 판정이라 가입에서
      받는 것과 가르지 못한다
    expect: needs-review
    ai: {ai-guard: no}
  - file: pipa-22-2/birthday-comment-only.tsx
    note: 알려진 한계(오경보). 주석의 birthday 도 정규식이 읽는다
    expect: needs-review
    ai: {ai-guard: no}
  - file: pipa-22-2/terms-sentence-only.ts
    id: pipa-22-2/terms-sentence-only.ts#judge-unsure
    note: 판정자가 답을 정하지 못하면(판정자가 없을 때와 같다) 문구 때문에 '불확실'로 남는다. 풀리지는 않는다
    expect: needs-review-uncertain
    ai: {ai-guard: unknown}

  # ── 가입 신호가 하나뿐인 파일 (2026-10-08 검토에서) ──────────────────────────
  # 거름막 signup-hint 는 signup-context 의 세 갈래가 쓰는 낱말을 모두 담아야 한다. 한쪽만 좁히면 실제 가입이
  # 조용해지는데, 신호가 여럿인 픽스처로는 드러나지 않는다. 갈래마다 그 신호 하나만 있는 파일을 둔다.
  - file: pipa-22-2/signup-korean-heading-only.tsx
    note: 가입 낱말이 띄어 쓴 '회원 가입' 제목뿐이다
    expect: needs-review
    ai: {ai-guard: no}
  - file: pipa-22-2/signup-camel-handler-only.ts
    note: 가입 낱말이 함수 이름 handleSignUp 뿐이다(대문자가 섞인 이름)
    expect: needs-review
    ai: {ai-guard: no}
  - file: pipa-22-2/signup-snake-name-only.js
    note: 가입 낱말이 함수 이름 sign_up 뿐이다
    expect: needs-review
    ai: {ai-guard: no}
  - file: pipa-22-2/signup-hyphen-route-only.ts
    note: 가입 낱말이 경로 "/auth/sign-up" 뿐이다
    expect: needs-review
    ai: {ai-guard: no}
  - file: pipa-22-2/register-member-call-only.ts
    note: 가입 낱말이 호출 이름 registerMember 뿐이다
    expect: needs-review
    ai: {ai-guard: no}
  - file: pipa-22-2/join-us-name-only.ts
    note: 가입 낱말이 함수 이름 joinUs 뿐이다
    expect: needs-review
    ai: {ai-guard: no}
  - file: pipa-22-2/signup-korean-unspaced-only.tsx
    note: 가입 낱말이 붙여 쓴 '회원가입' 제목뿐이다
    expect: needs-review
    ai: {ai-guard: no}
  - file: pipa-22-2/register-user-const-only.ts
    note: 가입 낱말이 화살표 함수를 담은 상수 이름 registerUser 뿐이다
    expect: needs-review
    ai: {ai-guard: no}
  - file: pipa-22-2/join-member-bare-call-only.ts
    note: >
      가입 낱말이 받는 쪽 없이 부르는 joinMember(...) 뿐이다. 들여온 이름이면 $O.$F(...) 에도 맞아 이 갈래만
      가려내지 못하므로 들여오지 않는다
    expect: needs-review
    ai: {ai-guard: no}
  - file: pipa-22-2/signup-single-quote-route-only.js
    note: 가입 낱말이 홑따옴표로 적은 경로 '/signup' 뿐이다
    expect: needs-review
    ai: {ai-guard: no}

  # ── 나이 신호가 하나뿐인 파일 (2026-10-08 검토에서) ──────────────────────────
  - file: pipa-22-2/birth-korean-label-only.tsx
    note: 나이 신호가 '생년월일' 라벨뿐이다(상태 이름은 ymd)
    expect: needs-review
    ai: {ai-guard: no}
  - file: pipa-22-2/age-field-decl-only.ts
    note: '나이 신호가 필드 선언(age: z.number()) 뿐이다'
    expect: needs-review
    ai: {ai-guard: no}
  - file: pipa-22-2/age-string-key-only.ts
    note: 나이 신호가 필드 이름 문자열("age") 뿐이다
    expect: needs-review
    ai: {ai-guard: no}
  - file: pipa-22-2/age-member-access-only.ts
    note: 나이 신호가 멤버 접근(req.body.age) 뿐이다
    expect: needs-review
    ai: {ai-guard: no}

  # ── 연령 문구의 경계 (2026-10-08 검토에서) ───────────────────────────────────
  - file: pipa-22-2/age-gate-checkbox.tsx
    id: pipa-22-2/age-gate-checkbox.tsx#judge-unsure
    note: >
      판정자가 답을 정하지 못하면 '만 14세 이상입니다' 문구 때문에 '불확실'로 남는다. 풀리지는 않는다
    expect: needs-review-uncertain
    ai: {ai-guard: unknown}
  - file: pipa-22-2/age-114-text.ts
    note: >
      '114세 미만' 은 연령 확인 문구가 아니다. 문구로 읽으면 판정자가 답을 정하지 못했을 때 '불확실'로 낮아진다.
      판정자의 '아니오'는 약한 대안의 매치를 덮으므로 이 경계는 '모름' 답으로만 드러난다
    expect: needs-review
    ai: {ai-guard: unknown}

  # ── 알려진 한계 (2026-10-08 검토에서) ───────────────────────────────────────
  - file: pipa-22-2/user-dob-suffix.ts
    note: 알려진 한계(놓침). dob 가 이름 뒤에 붙은 userDob · user_dob. dob 는 이름 앞에 올 때만 센다(adobe 같은 낱말 때문)
    expect: not-applicable
  - file: pipa-22-2/birth-inside-word-join-event.ts
    note: >
      알려진 한계(오경보). 다른 낱말 속의 birth(rebirthCount), dob 로 시작할 뿐인 낱말(doberman), 소켓 이벤트
      "join". 가입도 아니고 나이도 받지 않는다
    expect: needs-review
    ai: {ai-guard: no}
  - file: pipa-22-2/users-route-no-signup-word.ts
    note: >
      알려진 한계(놓침). 가입을 POST /api/users 로 받는다. 경로에도 이름에도 가입 낱말(signup·register·join·회원가입)이
      없어 적용되지 않는다
    expect: not-applicable
  - file: pipa-22-2/split-controller.ts
    note: >
      알려진 한계(놓침). 가입 경로(@Post("signup"))는 여기 있고 생년월일 필드는 DTO 파일에 있다. 파일 단위라 둘을
      잇지 못한다
    expect: not-applicable
  - file: pipa-22-2/split-create-user.dto.ts
    note: 알려진 한계(놓침). 위 컨트롤러가 받는 DTO. birthDate 는 있지만 가입 낱말이 없다
    expect: not-applicable
  - file: pipa-22-2/signup-template-route-only.ts
    note: >
      알려진 한계(놓침). 가입 경로를 기준 주소를 끼운 템플릿 문자열(`${API_URL}/auth/signup`)로만 적었다. 경로 식은
      따옴표 바로 뒤에서 경로가 시작해야 맞는다
    expect: not-applicable
  - file: pipa-22-2/signup-absolute-url-only.ts
    note: 알려진 한계(놓침). 가입 경로를 주소 전체("https://…/auth/signup")로만 적었다
    expect: not-applicable
  - file: pipa-22-2/exports-signup-assignment.js
    note: >
      알려진 한계(놓침). 가입 처리기를 대입으로 이름 붙였다(exports.signup = …). 이름은 함수 선언·메서드·const
      선언·호출에서만 본다
    expect: not-applicable
  - file: pipa-22-2/create-account-name.ts
    note: 알려진 한계(놓침). 가입 함수의 이름이 createAccount 다. 가입 낱말(signup·register·join·회원가입)이 없다
    expect: not-applicable
  - file: pipa-22-2/register-bare-name.ts
    note: >
      알려진 한계(놓침). 가입 함수의 이름이 register 뿐이다. register 는 registerUser·registerMember·registerAccount
      꼴만 센다(react-hook-form 의 register(), registerCleanup 과 가르려고)
    expect: not-applicable
