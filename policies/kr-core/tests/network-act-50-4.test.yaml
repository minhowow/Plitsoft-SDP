      kr.network-act.50-4/nonemail-end-optout: not-applicable

  # ── 매체가 드러나는 발송과 발송 대행사의 광고 표시 ──────────────────────────
  - file: network-act-50-4/sms-sns-publish.ts
    note: AWS SNS 의 PublishCommand 에 PhoneNumber 가 있으면 문자 발송이다(주제 게시는 매체를 모른다)
    expect:
      kr.network-act.50-4/nonemail-start-block: needs-review
      kr.network-act.50-4/nonemail-end-optout: needs-review
    ai:
      ai-start-block: no
      ai-optout-free: no

