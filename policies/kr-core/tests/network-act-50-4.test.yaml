      정적 대안(text·body·content)은 보지 못하고 AI 가 인용으로 푼다
    expect:
      kr.network-act.50-4/nonemail-start-block: compliant
      kr.network-act.50-4/nonemail-end-optout: compliant
    ai:
      ai-start-block:
        answer: yes
        cite: 'msg: "(광고) 가나다몰 02-123-4567 가입 축하 프로모션 쿠폰이 발급됐어요!\n무료거부 080-123-4567",'
      ai-optout-free:
        answer: yes
        cite: 'msg: "(광고) 가나다몰 02-123-4567 가입 축하 프로모션 쿠폰이 발급됐어요!\n무료거부 080-123-4567",'

