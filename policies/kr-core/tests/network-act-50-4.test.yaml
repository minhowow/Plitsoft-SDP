# yaml-language-server: $schema=../../../schemas/policy-test-0.1.json
#
# 규칙 다섯 개가 매체로 갈린다. 문자·푸시 픽스처는 앞의 두 규칙(시작 부분·끝 부분)을, 이메일 픽스처는
# 뒤의 세 규칙(제목·본문 전송자 정보·본문 수신거부)을 적는다. 적지 않은 규칙은 경고가 없어야 한다.
#
# 50-3(야간 별도 동의)은 매체를 가른다. 전자우편만 보내는 픽스처는 제50조③ 단서와 시행령
# 제61조② 로 해당 없음이다. 문자·푸시 픽스처는 대개 야간 차단이나 주간 스케줄을 두어 50-3 이 준수로
# 끝나지만, 야간 차단이 없는 광고 문자 픽스처가 셋 있다(sms-name-address·sms-spaced-label·
# twilio-comment-only). 그 셋은 50-3 의 판정을 여기에 그대로 적는다. 50-3 이 못 보는 덕에 조용히
# 지나가는 모양으로 두지 않는다.
apiVersion: policypack/test-0.1
cases:
  # ── 문자·앱 푸시·메신저 (별표 6 그 밖의 전자적 전송매체 2.가·나) ─────────────
  - file: network-act-50-4/sms-no-disclosure.ts
    note: 마케팅 동의만 확인하고 (광고)·전송자·무료 수신거부가 모두 없다
    expect:
      kr.network-act.50-4/nonemail-start-block: needs-review
      kr.network-act.50-4/nonemail-end-optout: needs-review
    ai:
      ai-start-block: no
      ai-optout-free: no

  - file: network-act-50-4/sms-inline-template.ts
    note: 보내는 템플릿이 (광고)+명칭+전화번호로 시작하고 무료거부 080 으로 끝난다
    expect:
      kr.network-act.50-4/nonemail-start-block: compliant
      kr.network-act.50-4/nonemail-end-optout: compliant

  - file: network-act-50-4/sms-name-address.js
    note: 별표 6 2.가 의 명칭+주소 갈래. 정적 대안은 전화번호만 보므로 AI 가 시작 줄을 인용해야 풀린다
    # 야간 차단이 없는 광고 문자다. 50-3 이 NCP SENS 로 가는 axios.post 를 발송으로 세면서 걸린다
    expect:
      kr.network-act.50-3/ad-send-without-night-guard: needs-review
      kr.network-act.50-4/nonemail-start-block: compliant
      kr.network-act.50-4/nonemail-end-optout: compliant
    ai:
      ai-night-guard: no
      ai-start-block:
        answer: yes
        cite: '"(광고) 가나다베이커리 서울특별시 중구 세종대로 110\n" +'

  - file: network-act-50-4/push-helper-prefix.ts
    note: 헬퍼가 상수로 앞뒤를 붙인다. 보내는 값에는 표기가 직접 보이지 않아 둘 다 AI 인용으로만 풀린다
    expect:
      kr.network-act.50-4/nonemail-start-block: compliant
      kr.network-act.50-4/nonemail-end-optout: compliant
    ai:
      ai-start-block:
        answer: yes
        cite: 'return `(광고) ${SENDER} ${SENDER_TEL}\n${body}\n무료수신거부 ${OPT_OUT_TEL}`;'
      ai-optout-free:
        answer: yes
        cite: 'return `(광고) ${SENDER} ${SENDER_TEL}\n${body}\n무료수신거부 ${OPT_OUT_TEL}`;'

  - file: network-act-50-4/sms-080-without-free.js
    note: 080 번호라도 수신자가 비용을 부담하지 않는다는 표시(무료)를 함께 적어야 한다(별표 6 2.나)
    decoy-for: [optout-080-free]
    expect:
      kr.network-act.50-4/nonemail-start-block: compliant
      kr.network-act.50-4/nonemail-end-optout: needs-review
    ai:
      ai-optout-free: no

  - file: network-act-50-4/sms-spaced-label.js
    note: 별표 6 이 적은 표기는 '(광고)' 다. '(광 고)' 는 시작 표기로 세지 않는다. 끝의 무료거부는 맞다
    # 야간 차단이 없는 광고 문자다. 50-3 의 ad-marker 가 빈칸을 넣은 표시도 세므로 함께 걸린다
    expect:
      kr.network-act.50-3/ad-send-without-night-guard: needs-review
      kr.network-act.50-4/nonemail-start-block: needs-review
      kr.network-act.50-4/nonemail-end-optout: compliant
    ai:
      ai-night-guard: no
      ai-start-block: no

  - file: network-act-50-4/sms-label-mid-array.ts
    note: 파일에 (광고)·무료거부 문자열은 있지만 보내는 메시지의 시작과 끝이 아니다
    expect:
      kr.network-act.50-4/nonemail-start-block: needs-review
      kr.network-act.50-4/nonemail-end-optout: needs-review
    ai:
      ai-start-block: no
      ai-optout-free: no

  - file: network-act-50-4/sms-1588-free.js
    note: 1588 은 거는 쪽이 요금을 낸다. '무료'를 붙여도 정적으로는 풀지 않는다
    decoy-for: [optout-080-free]
    expect:
      kr.network-act.50-4/nonemail-start-block: compliant
      kr.network-act.50-4/nonemail-end-optout: needs-review
    ai:
      ai-optout-free: no

  - file: network-act-50-4/push-label-only.ts
    note: 푸시 제목의 (광고)만으로는 전송자 명칭·연락처와 무료 수신거부 방법이 채워지지 않는다
    expect:
      kr.network-act.50-4/nonemail-start-block: needs-review
      kr.network-act.50-4/nonemail-end-optout: needs-review
    ai:
      ai-start-block: no
      ai-optout-free: no

  - file: network-act-50-4/twilio-comment-only.js
    note: 표기가 TODO 주석에만 있다. 정적 대안은 보내는 값만 보므로 주석으로 풀리지 않는다
    # 야간 차단이 없는 광고 문자다. 50-3 의 ad-marker 는 주석의 (광고)도 세고, messages.create 도 발송이다
    expect:
      kr.network-act.50-3/ad-send-without-night-guard: needs-review
      kr.network-act.50-4/nonemail-start-block: needs-review
      kr.network-act.50-4/nonemail-end-optout: needs-review
    ai:
      ai-night-guard: no
      ai-start-block: no
      ai-optout-free: no
  - file: network-act-50-4/twilio-comment-only.js
    id: network-act-50-4/twilio-comment-cited
    note: >
      같은 파일에서 판정자가 TODO 주석의 문구를 인용해 '예'라고 답한다. 주석 인용은 받지 않는다(required
      도 줄 전체가 주석인 인용은 받지 않는다). strict 를 못 박는 것은 아래 twilio-trailing-todo 다
    expect:
      kr.network-act.50-3/ad-send-without-night-guard: needs-review
      # 인용이 코드에 없으니 '예'는 '모름'이 된다. 경고는 풀리지 않고 불확실로 남는다
      kr.network-act.50-4/nonemail-start-block: needs-review-uncertain
      kr.network-act.50-4/nonemail-end-optout: needs-review-uncertain
    ai:
      ai-night-guard: no
      ai-start-block:
        answer: yes
        cite: '// TODO: 문구 앞에 (광고) 가나다몰 02-123-4567, 끝에 무료거부 080-123-4567 붙이기'
      ai-optout-free:
        answer: yes
        cite: '// TODO: 문구 앞에 (광고) 가나다몰 02-123-4567, 끝에 무료거부 080-123-4567 붙이기'

  - file: network-act-50-4/twilio-trailing-todo.js
    note: >
      TODO 가 코드 줄 끝에 붙어 있고, 판정자가 그 줄을 통째로 인용해 '예'라고 답한다. required 는 주석을 떼고
      남은 코드(const from = ...)가 실재하니 받는다. 이 정책의 AI 대안은 '이 문구가 코드에 실제로 있는가'를
      묻는 strict 라 인용을 한 글자도 고치지 않고 주석 없는 코드에서 찾으므로 받지 않는다. evidence 를
      required 로 되돌리면 이 case 가 '준수'로 바뀌어 실패한다
    expect:
      kr.network-act.50-3/ad-send-without-night-guard: needs-review
      kr.network-act.50-4/nonemail-start-block: needs-review-uncertain
      kr.network-act.50-4/nonemail-end-optout: needs-review-uncertain
    ai:
      ai-night-guard: no
      ai-start-block:
        answer: yes
        cite: 'const from = process.env.TWILIO_FROM; // TODO: 문구 앞에 (광고) 가나다몰 02-123-4567, 끝에 무료거부 080-123-4567 붙이기'
      ai-optout-free:
        answer: yes
        cite: 'const from = process.env.TWILIO_FROM; // TODO: 문구 앞에 (광고) 가나다몰 02-123-4567, 끝에 무료거부 080-123-4567 붙이기'
  - file: network-act-50-4/sms-cms-template.ts
    note: 문구가 CMS 템플릿이라 코드로 확인할 수 없다. 풀지 않고 확인 질문으로 넘긴다
    expect:
      kr.network-act.50-4/nonemail-start-block: needs-review
      kr.network-act.50-4/nonemail-end-optout: needs-review
    ai:
      ai-start-block: no
      ai-optout-free: no

  - file: network-act-50-4/sms-shipping-notice.ts
    note: 배송 안내는 거래정보다(방송미디어통신위원회 FAQ). '쿠폰 할인' 이 들어가도 광고 어휘로 세지 않는다
    expect:
      kr.network-act.50-4/nonemail-start-block: not-applicable
      kr.network-act.50-4/nonemail-end-optout: not-applicable

  - file: network-act-50-4/express-coupon-route.ts
    note: 광고 어휘가 있지만 res.send 는 HTTP 응답이다. 수신자에게 보내는 발송 호출이 아니다
    expect:
      kr.network-act.50-4/nonemail-start-block: not-applicable
      kr.network-act.50-4/nonemail-end-optout: not-applicable

  - file: network-act-50-4/llm-promo-copy.ts
    note: messages.create 가 문자 발송이 아니라 LLM 호출이다. 문구를 만들기만 하고 보내지 않는다
    expect:
      kr.network-act.50-4/nonemail-start-block: not-applicable
      kr.network-act.50-4/nonemail-end-optout: not-applicable

  # ── 강한 정적 대안은 발송 호출에 넘긴 값만 본다 ─────────────────────────────
  - file: network-act-50-4/sms-unsent-sample.ts
    note: >
      미리보기용 SAMPLE 객체가 (광고)·명칭·번호·무료거부를 갖췄지만 보내지 않는다. 실제로 보내는
      값에는 표기가 없다. 파일 어딘가의 문자열로 경고를 풀면 안 된다
    expect:
      kr.network-act.50-4/nonemail-start-block: needs-review
      kr.network-act.50-4/nonemail-end-optout: needs-review
    ai:
      ai-start-block: no
      ai-optout-free: no

  - file: network-act-50-4/sms-headline-not-name.ts
    note: >
      (광고) 바로 뒤가 머리말('주말특가!')이고 번호는 문의 번호다. 명칭 자리는 문장부호 없는 낱말
      하나로 두어 머리말이 명칭으로 세지지 않게 한다(별표 6 2.가)
    decoy-for: [label-name-phone]
    expect:
      kr.network-act.50-4/nonemail-start-block: needs-review
      kr.network-act.50-4/nonemail-end-optout: compliant
    ai:
      ai-start-block: no

  - file: network-act-50-4/sms-optout-then-append.ts
    note: >
      080 무료거부 뒤에 쿠폰 줄을 += 로 붙인다. 끝 부분이 더는 수신거부가 아니다(별표 6 2.나).
      시작 부분은 그대로여서 AI 가 인용으로 푼다
    expect:
      kr.network-act.50-4/nonemail-start-block: compliant
      kr.network-act.50-4/nonemail-end-optout: needs-review
    ai:
      ai-start-block:
        answer: yes
        cite: 'let text = "(광고) 가나다몰 02-123-4567\n가을 세일 전 품목 30%\n무료거부 080-123-4567";'
      ai-optout-free: no

  # ── 광고 어휘가 주석·식별자에만 있으면 거래 안내를 경고로 만들지 않는다 ──
  - file: network-act-50-4/sms-shipping-event-comment.ts
    note: 배송 안내다. '배송 시작 이벤트가 오면 호출된다' 같은 주석의 '이벤트'는 광고 신호로 세지 않는다
    expect:
      kr.network-act.50-4/nonemail-start-block: not-applicable
      kr.network-act.50-4/nonemail-end-optout: not-applicable

  - file: network-act-50-4/sms-pos-receipt.js
