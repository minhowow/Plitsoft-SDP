# yaml-language-server: $schema=../../../schemas/policy-test-0.1.json
#
# 생성형 AI 결과를 화면에 그리는 픽스처에는 제31조 제2항 정책(kr.ai-basic-act.31)도 걸린다.
# 그 경우는 두 규칙의 기대를 함께 적는다. ② 의 기대는 결과물 표시가 있는지만 본 것이다.
# 기대를 적지 않은 규칙은 '경고 없음'이 기대다(준수 또는 해당 없음).
#
# 이 정책의 정적 대안 셋(prior-notice-text·notice-component·notice-gate-flag)은 모두 약한 근거라
# AI 확인 없이는 경고를 풀지 않는다. 그래서 그 대안의 픽스처에는 ai-prior-notice 스텁이 있고, 스텁은
# 파일에 실제로 있는 줄을 인용할 때만 '예'다.
apiVersion: policypack/test-0.1
rule: kr.ai-basic-act.31-1/genai-feature-without-prior-notice
cases:
  # ── 위반 모양 ──────────────────────────────────────────────────────────────
  - file: ai-basic-act-31-1/violating.tsx
    note: AI SDK 의 useChat 채팅 화면. 제목은 '고객 상담'뿐이고 고지가 없다
    expect:
      kr.ai-basic-act.31-1/genai-feature-without-prior-notice: needs-review
      kr.ai-basic-act.31/ai-output-without-label: needs-review
    ai: {ai-prior-notice: no, ai-label: no, ai-machine-mark: no}
  - file: ai-basic-act-31-1/image-studio.tsx
    note: 서버 액션에서 openai.images.generate. '썸네일 스튜디오'라는 이름으로는 AI 활용이 드러나지 않는다
    expect:
      kr.ai-basic-act.31-1/genai-feature-without-prior-notice: needs-review
      kr.ai-basic-act.31/ai-output-without-label: needs-review
    ai: {ai-prior-notice: no, ai-label: no, ai-machine-mark: no}

  # ── 대안마다 그 대안 하나로 풀리는 픽스처 ─────────────────────────────────
  - file: ai-basic-act-31-1/prior-notice-text.tsx
    note: 입력창 위의 고지 문단 (시행령 제23조 제1항 제2호)
    expect:
      kr.ai-basic-act.31-1/genai-feature-without-prior-notice: compliant
      kr.ai-basic-act.31/ai-output-without-label: needs-review
    ai:
      ai-label: no
      ai-machine-mark: no
      ai-prior-notice: {answer: yes, cite: '이 상담 서비스는 생성형 인공지능(AI)을 기반으로 운영됩니다.'}
  - file: ai-basic-act-31-1/prior-notice-text-en.tsx
    note: 영어 고지. 법 제4조 제1항에 따라 국외 서비스도 국내 이용자에게 영향을 미치면 적용된다
    expect:
      kr.ai-basic-act.31-1/genai-feature-without-prior-notice: compliant
      kr.ai-basic-act.31/ai-output-without-label: needs-review
    ai:
      ai-label: no
      ai-machine-mark: no
      ai-prior-notice: {answer: yes, cite: 'This help desk is powered by generative AI.'}
  - file: ai-basic-act-31-1/notice-const-rendered.tsx
    note: >
      고지 문구를 상수(AI_NOTICE)에 두고 <p>{AI_NOTICE}</p> 로 조건 없이 그린다. 상수 대안은
      선언만으로는 풀리지 않고 그 상수가 화면에 렌더링되어야 한다
    expect:
      kr.ai-basic-act.31-1/genai-feature-without-prior-notice: compliant
      kr.ai-basic-act.31/ai-output-without-label: needs-review
    ai:
      ai-label: no
      ai-machine-mark: no
      ai-prior-notice: {answer: yes, cite: '<p role="note">{AI_NOTICE}</p>'}
  - file: ai-basic-act-31-1/notice-component.tsx
    note: >
      자체 엔드포인트(/api/assistant)만 부르는 위젯. 고지는 가져온 AiDisclosureBanner 가 그린다
      (같은 디렉터리의 AiDisclosureBanner.tsx). 이름만 본 약한 대안이라 판정자가 이 파일의
      <AiDisclosureBanner /> 줄을 인용해야 풀린다. 배너 본문은 다른 파일이라 판정자에게 보이지 않는다
    expect:
      kr.ai-basic-act.31-1/genai-feature-without-prior-notice: compliant
      kr.ai-basic-act.31/ai-output-without-label: needs-review
    ai:
      ai-label: no
      ai-machine-mark: no
      ai-prior-notice: {answer: yes, cite: '<AiDisclosureBanner />'}
  - file: ai-basic-act-31-1/notice-gate-flag.tsx
    note: >
      AI 고지를 본 적이 없으면 안내 시트를 먼저 띄우고(return) 채팅으로 넘어가지 않는다. 플래그 이름만 본
      약한 대안이라 판정자 확인이 필요하다. 그런데 안내 내용은 다른 파일(WelcomeSheet)에 있어 이 파일에는
      'AI 기반'이라는 문구가 없다. 질문에 정직한 답은 '아니오'이고 경고가 남는다(terms-gate 와 같다)
    expect:
      kr.ai-basic-act.31-1/genai-feature-without-prior-notice: needs-review
      kr.ai-basic-act.31/ai-output-without-label: needs-review
    ai: {ai-prior-notice: no, ai-label: no, ai-machine-mark: no}
  - file: ai-basic-act-31-1/notice-gate-redirect.tsx
    note: >
      같은 분기를 return 이 아니라 router.replace 로 막는다. 분기 본문이 보내거나 돌려보내야
      고지 확인 분기로 센다(list.push 같은 호출은 받지 않는다). 안내 내용은 /assistant/intro 에 있어
      이 파일에는 없다. notice-gate-flag 처럼 정직한 답은 '아니오'다
    expect:
      kr.ai-basic-act.31-1/genai-feature-without-prior-notice: needs-review
      kr.ai-basic-act.31/ai-output-without-label: needs-review
    ai: {ai-prior-notice: no, ai-label: no, ai-machine-mark: no}
  - file: ai-basic-act-31-1/ai-prior-notice.tsx
    note: >
      정적 대안은 못 알아보는 이용 전 화면 문구. 서비스명('AI 이미지 생성기')만으로 풀지 않는다
      (시행령 제23조 제4항 제1호는 사람이 판단한다). 판정자가 입력창 위 문구를 인용해야 풀린다
    expect:
      kr.ai-basic-act.31-1/genai-feature-without-prior-notice: compliant
      kr.ai-basic-act.31/ai-output-without-label: compliant
    ai:
      ai-prior-notice: {answer: yes, cite: "<p>문장을 입력하면 AI가 이미지를 그려 드립니다.</p>"}
      ai-label: {answer: yes, cite: "<p>문장을 입력하면 AI가 이미지를 그려 드립니다.</p>"}
      ai-machine-mark: no

  # ── 해당 없음: 함정 ────────────────────────────────────────────────────────
  - file: ai-basic-act-31-1/twilio-sms.tsx
    note: Twilio 의 client.messages.create 는 Anthropic SDK 와 모양이 같다
    expect: not-applicable
  - file: ai-basic-act-31-1/twilio-with-moderation.tsx
    note: >
      같은 Twilio 발송인데 이 파일은 OpenAI 도 가져온다(생성하지 않는 moderations 용). 받는 쪽
      sms 를 twilio() 로 만들었으므로 AI 호출로 세지 않는다. 파일에 AI import 가 있다는 것만으로
      묶으면 이 화면이 걸렸다
    expect: not-applicable
  - file: ai-basic-act-31-1/stream-chat-support.tsx
    note: >
      Stream Chat 의 channel.sendMessage 는 Gemini 채팅 세션의 chat.sendMessage 와 모양이 같다.
      @google 모듈에서 온 startChat·chats.create 로 만든 세션만 받는다
    expect: not-applicable
  - file: ai-basic-act-31-1/raw-embeddings-search.tsx
    note: >
      제공자 URL 을 직접 부르지만 /v1/embeddings 라 생성하지 않는다(법 제2조 제5호). SDK 꼴
      (semantic-search.tsx)뿐 아니라 이 꼴도 걸러야 한다
    expect: not-applicable
  - file: ai-basic-act-31-1/openai-models-admin.tsx
    note: 제공자 URL 의 /v1/models 는 모델 목록 조회다. 생성 호출이 아니다
    expect: not-applicable
  - file: ai-basic-act-31-1/admin-ai-usage.tsx
    note: >
      /api/ai/usage 는 토큰 사용량 표다. 관리 화면의 하위 경로(usage·seats·billing 등)는
      자체 엔드포인트 이름 규칙에서 뺀다. 제31조 제2항 규칙은 이름만 보는 문턱(/api/ai/)이 걸려
      그대로 검토 필요로 남는다(알려진 오탐, 경고를 올리는 쪽)
    expect:
      kr.ai-basic-act.31-1/genai-feature-without-prior-notice: not-applicable
      kr.ai-basic-act.31/ai-output-without-label: needs-review
    ai: {ai-label: no, ai-machine-mark: no}
  - file: ai-basic-act-31-1/human-live-chat.tsx
    note: 상담사(사람)와의 채팅. useChat 은 직접 만든 훅이다
    expect: not-applicable
  - file: ai-basic-act-31-1/ai-course-page.tsx
    note: >
      AI 라는 말이 많이 나오지만 모델을 부르지 않는 강의 소개. 두 규칙 모두 적용되지 않는다(제31조 제2항
      규칙이 이름 AiCoursePage 로 적용되던 한계는 코드 모양을 보는 적용 조건으로 풀었다)
    expect:
      kr.ai-basic-act.31-1/genai-feature-without-prior-notice: not-applicable
      kr.ai-basic-act.31/ai-output-without-label: not-applicable
  - file: ai-basic-act-31-1/chat-route.ts
    note: 화면 없는 API 경로. 고지는 이 경로를 쓰는 화면(또는 약관·계약서)에서 본다
    expect: not-applicable
  - file: ai-basic-act-31-1/ts-assertion-route.ts
    note: .ts 파일의 타입 단언(return <any>...)은 JSX 가 아니다
    expect: not-applicable
  - file: ai-basic-act-31-1/survey-responses.tsx
    note: 설문 SDK 의 tf.responses.create 는 OpenAI Responses API 와 모양이 같다
    expect: not-applicable
  - file: ai-basic-act-31-1/semantic-search.tsx
    note: OpenAI SDK 를 부르지만 임베딩이라 생성형 결과물을 만들지 않는다 (법 제2조 제5호)
    expect: not-applicable

  # ── 적용: 놓치던 생성 호출 모양 ────────────────────────────────────────────
  - file: ai-basic-act-31-1/gemini-chat-session.tsx
    note: >
      @google/generative-ai 의 공식 채팅 꼴(model.startChat 뒤 chat.sendMessage). generateContent 만
      보던 때는 이 화면이 통째로 빠졌다
    expect:
      kr.ai-basic-act.31-1/genai-feature-without-prior-notice: needs-review
      kr.ai-basic-act.31/ai-output-without-label: needs-review
    ai: {ai-prior-notice: no, ai-label: no, ai-machine-mark: no}
  - file: ai-basic-act-31-1/langchain-lcel.tsx
    note: LangChain 의 표준 꼴인 LCEL 체인(prompt.pipe(...).pipe(...) 뒤 chain.invoke)
    expect:
      kr.ai-basic-act.31-1/genai-feature-without-prior-notice: needs-review
      kr.ai-basic-act.31/ai-output-without-label: needs-review
    ai: {ai-prior-notice: no, ai-label: no, ai-machine-mark: no}
  - file: ai-basic-act-31-1/bedrock-converse.tsx
    note: Amazon Bedrock 의 ConverseCommand. 모델 이름이 파일에 없어도 명령 이름과 import 로 잡는다
    expect:
      kr.ai-basic-act.31-1/genai-feature-without-prior-notice: needs-review
      kr.ai-basic-act.31/ai-output-without-label: needs-review
    ai: {ai-prior-notice: no, ai-label: no, ai-machine-mark: no}
  - file: ai-basic-act-31-1/rsc-actions.tsx
    note: ai/rsc 의 useActions·useUIState 로 서버 액션의 생성 결과를 그리는 화면
    expect:
      kr.ai-basic-act.31-1/genai-feature-without-prior-notice: needs-review
      kr.ai-basic-act.31/ai-output-without-label: needs-review
    ai: {ai-prior-notice: no, ai-label: no, ai-machine-mark: no}
  - file: ai-basic-act-31-1/lib-ai-helper.tsx
    note: >
      자체 AI 모듈의 도우미(@/lib/ai 의 summarizeReviews). 경로 이름만 본 약한 근거다.
      그 요약을 화면에 그리므로 제31조 제2항 규칙도 적용된다(AI 모듈을 가져오는 것을 적용 조건이 본다)
    expect:
      kr.ai-basic-act.31-1/genai-feature-without-prior-notice: needs-review
      kr.ai-basic-act.31/ai-output-without-label: needs-review
    ai: {ai-prior-notice: no, ai-label: no, ai-machine-mark: no}
  - file: ai-basic-act-31-1/base-url-chat.tsx
    note: 기준 URL 을 붙인 템플릿 문자열 `${API_BASE}/api/chat`
    expect:
      kr.ai-basic-act.31-1/genai-feature-without-prior-notice: needs-review
      kr.ai-basic-act.31/ai-output-without-label: needs-review
    ai: {ai-prior-notice: no, ai-label: no, ai-machine-mark: no}
  - file: ai-basic-act-31-1/raw-provider-chat.tsx
    note: 제공자 URL 을 직접 부르는 생성 호출(/v1/chat/completions). 생성하지 않는 경로만 뺐다
    expect:
      kr.ai-basic-act.31-1/genai-feature-without-prior-notice: needs-review
      kr.ai-basic-act.31/ai-output-without-label: needs-review
    ai: {ai-prior-notice: no, ai-label: no, ai-machine-mark: no}
  - file: ai-basic-act-31-1/draft-then-sms.tsx
    note: >
      anthropic.messages.create 로 문자 초안을 만들어 Twilio 로 보낸다. 같은 파일에 Twilio 가 있어도
      받는 쪽이 AI 클라이언트면 그대로 적용된다(twilio-with-moderation.tsx 의 반대 짝)
    expect:
      kr.ai-basic-act.31-1/genai-feature-without-prior-notice: needs-review
      kr.ai-basic-act.31/ai-output-without-label: needs-review
    ai: {ai-prior-notice: no, ai-label: no, ai-machine-mark: no}

  # ── 검토 필요: 함정 ────────────────────────────────────────────────────────
  - file: ai-basic-act-31-1/terms-gate.tsx
    note: >
      AI 약관 동의로 막는 경로(시행령 제23조 제1항 제1호 후보). 약관에 AI 기반 운용 사실이 적혀
      있다는 근거가 주석과 이름뿐이라 풀지 않는다. 약관 조항은 사람이 확인한다
    expect:
      kr.ai-basic-act.31-1/genai-feature-without-prior-notice: needs-review
      kr.ai-basic-act.31/ai-output-without-label: needs-review
    ai: {ai-prior-notice: no, ai-label: no, ai-machine-mark: no}
  - file: ai-basic-act-31-1/terms-gate.tsx
    id: terms-gate-comment-cite
    note: >
      같은 파일에 판정자가 '예'를 하고 3행 주석을 인용한 경우. 주석 인용은 받지 않는다. 관문이 받지 않은
      '예'는 판정에 넣지 않으므로 판정자가 없을 때와 같은 확실한 검토 필요다(AI 확인 필요로 남는다)
    expect:
      kr.ai-basic-act.31-1/genai-feature-without-prior-notice: needs-review
      kr.ai-basic-act.31/ai-output-without-label: needs-review
    ai:
      ai-prior-notice: {answer: yes, cite: '약관 제7조: 본 서비스는 생성형 인공지능을 기반으로 운용됩니다'}
      ai-label: no
      ai-machine-mark: no
  - file: ai-basic-act-31-1/terms-gate.tsx
    id: terms-gate-fullline-cite
    note: >
      끝에 주석이 붙은 3행을 통째로 인용한 경우. required 는 주석을 떼고 남은 import 줄이 코드에 있어
      받지만, strict 는 인용을 한 글자도 고치지 않고 주석 없는 코드에서 찾으므로 받지 않는다
    expect:
      kr.ai-basic-act.31-1/genai-feature-without-prior-notice: needs-review
      kr.ai-basic-act.31/ai-output-without-label: needs-review
    ai:
      ai-prior-notice:
        answer: yes
        cite: 'import { AI_SERVICE_TERMS_VERSION } from "@/lib/terms"; // 약관 제7조: 본 서비스는 생성형 인공지능을 기반으로 운용됩니다'
      ai-label: no
      ai-machine-mark: no
  - file: ai-basic-act-31-1/result-badge-only.tsx
    note: >
      답변마다 'AI 생성' 배지(제2항)는 있지만 첫 답변 전에는 아무것도 보이지 않는다. 제2항 규칙의 배지
      문구는 약한 대안이라 판정자가 그 줄을 인용해 확인한다
    expect: needs-review
    ai:
      ai-prior-notice: no
      kr.ai-basic-act.31/ai-output-without-label/ai-label:
        answer: yes
        cite: '{m.role === "assistant" && <span className="badge">AI 생성</span>}'
      kr.ai-basic-act.31/ai-output-without-label/ai-machine-mark: no
  - file: ai-basic-act-31-1/notice-flag-off.tsx
    note: 고지 배너가 꺼진 플래그 뒤에 있다(&& 꼴)
    expect:
      kr.ai-basic-act.31-1/genai-feature-without-prior-notice: needs-review
      kr.ai-basic-act.31/ai-output-without-label: needs-review
    ai: {ai-prior-notice: no, ai-label: no, ai-machine-mark: no}
  - file: ai-basic-act-31-1/ternary-flag-off-component.tsx
    note: '같은 함정의 삼항 꼴 `{showAiNotice ? <AiNoticeBanner /> : null}`. 플래그는 상수 false 다'
    expect:
      kr.ai-basic-act.31-1/genai-feature-without-prior-notice: needs-review
      kr.ai-basic-act.31/ai-output-without-label: needs-review
    ai: {ai-prior-notice: no, ai-label: no, ai-machine-mark: no}
  - file: ai-basic-act-31-1/ternary-flag-off-text.tsx
    note: 같은 함정의 삼항 + 문구 꼴. 상수 false 플래그 뒤의 고지는 이용자에게 보이지 않는다
    expect:
      kr.ai-basic-act.31-1/genai-feature-without-prior-notice: needs-review
      kr.ai-basic-act.31/ai-output-without-label: needs-review
    ai: {ai-prior-notice: no, ai-label: no, ai-machine-mark: no}
  - file: ai-basic-act-31-1/notice-flag-off-if.tsx
    note: >
      같은 함정의 if 꼴. 진입을 막기는 하지만 플래그가 상수 false 라 고지 모달이 뜨지 않는다.
      notice-gate-flag 는 상수로 정해진 플래그를 받지 않는다
    expect:
      kr.ai-basic-act.31-1/genai-feature-without-prior-notice: needs-review
      kr.ai-basic-act.31/ai-output-without-label: needs-review
    ai: {ai-prior-notice: no, ai-label: no, ai-machine-mark: no}
  - file: ai-basic-act-31-1/notice-after-first-reply.tsx
