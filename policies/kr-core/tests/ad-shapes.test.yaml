  - file: ad-shapes/slack-ad-review.ts
    note: >
      알려진 한계(오경보). 사내 슬랙 알림의 [광고] 말머리가 광고 발송으로 읽힌다
    expect:
      kr.network-act.50-3/ad-send-without-night-guard: needs-review
    ai:
