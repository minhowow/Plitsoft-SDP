  # ── 판정자가 풀어야 하는 것 ─────────────────────────────────────────────────────────
  - file: ad-shapes/nest-cron-daytime.ts
    note: >
      @Cron 오전 10시(Asia/Seoul). 데코레이터로 건 스케줄은 정적 대안이 알아보지 못한다. 판정자가 그 줄을
      인용해야 풀린다
    expect:
      kr.network-act.50-3/ad-send-without-night-guard: compliant
    ai:
      ai-night-guard:
        answer: yes
        cite: '@Cron("0 0 10 * * *", { timeZone: "Asia/Seoul" })'
  - file: ad-shapes/daytime-positive.ts
    note: >
      주간일 때만 보내는 긍정형 조건(8 <= h < 21, 서울 시각). 정적 대안은 야간에 빠져나가는 꼴만 본다
    expect:
      kr.network-act.50-3/ad-send-without-night-guard: compliant
      kr.network-act.50-4/nonemail-start-block: compliant
      kr.network-act.50-4/nonemail-end-optout: compliant
    ai:
      ai-night-guard:
        answer: yes
        cite: 'if (hour >= 8 && hour < 21) {'
  - file: ad-shapes/night-consent-other-name.ts
    note: >
      야간 동의 필드의 이름이 night 가 아니다(allowLateHoursAd)
    expect:
      kr.network-act.50-3/ad-send-without-night-guard: compliant
      kr.network-act.50-4/nonemail-start-block: compliant
      kr.network-act.50-4/nonemail-end-optout: compliant
    ai:
      ai-night-guard:
        answer: yes
        cite: 'const targets = await db.member.findMany({ where: { smsAgreed: true, allowLateHoursAd: true } });'
  - file: ad-shapes/kst-plus9-guard.ts
    note: >
      UTC 로 도는 서버에서 getUTCHours() + 9 로 한국 시각을 구해 야간이면 빠져나간다. 정적 대안은 UTC 시각에서 나온
      값을 받지 않으므로 판정자가 그 줄을 인용해야 풀린다
    expect:
      kr.network-act.50-3/ad-send-without-night-guard: compliant
      kr.network-act.50-4/nonemail-start-block: compliant
      kr.network-act.50-4/nonemail-end-optout: compliant
    ai:
      ai-night-guard:
        answer: yes
        cite: 'const kstHour = (new Date().getUTCHours() + 9) % 24;'
