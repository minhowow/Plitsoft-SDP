  - file: ad-shapes/no-vocab-ad.ts
    note: >
      알려진 한계(놓침). 광고 낱말도 표시도 없는 광고 문자
    expect:
      kr.network-act.50-3/ad-send-without-night-guard: not-applicable
  - file: ad-shapes/coupon-ad.ts
    note: >
      알려진 한계(놓침). 쿠폰·할인만 있는 광고 문자. 두 낱말은 광고 낱말 목록에 없다
    expect:
      kr.network-act.50-3/ad-send-without-night-guard: not-applicable
      kr.network-act.50-4/nonemail-start-block: not-applicable
      kr.network-act.50-4/nonemail-end-optout: not-applicable
  - file: ad-shapes/english-ad.ts
    note: >
      알려진 한계(놓침). 영어 광고 푸시(deal, off)
    expect:
      kr.network-act.50-3/ad-send-without-night-guard: not-applicable
  # ── 광고가 아닌 것 ──────────────────────────────────────────────────────────────
  - file: ad-shapes/otp-with-consent-flag.ts
    note: >
      알려진 한계(오경보). 인증번호 문자다. 같은 파일의 marketingAgreed 필드 이름이 광고 낱말로 읽힌다
