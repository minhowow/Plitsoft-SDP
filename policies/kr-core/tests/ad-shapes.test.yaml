      ai-body-sender: no
      ai-body-optout: no
  - file: ad-shapes/calendar-event-push.ts
    note: >
      알려진 한계(오경보). 일정 앱의 '이벤트' 알림이다. 낱말 '이벤트' 가 광고 낱말로 읽힌다
    expect:
      kr.network-act.50-4/nonemail-start-block: needs-review
      kr.network-act.50-4/nonemail-end-optout: needs-review
    ai:
      ai-start-block: no
      ai-optout-free: no
  - file: ad-shapes/ad-badge-list.jsx
