# yaml-language-server: $schema=../../../schemas/policy-test-0.1.json
apiVersion: policypack/test-0.1
rule: kr.pipa.28-8/personal-data-to-overseas-ai
cases:
  - file: pipa-28-8/openai-profile-summary.ts
    note: 회원의 이름·이메일·전화번호를 OpenAI 채팅 API 프롬프트에 그대로 넣는다
    expect: needs-review
    ai: {no-personal-data-sent: no}
  - file: pipa-28-8/anthropic-support-reply.ts
    expect: needs-review
    ai: {no-personal-data-sent: no}
  - file: pipa-28-8/ai-sdk-generate-text.ts
    note: AI SDK 의 generateText 와 @ai-sdk/openai 제공자
    expect: needs-review
    ai: {no-personal-data-sent: no}
  - file: pipa-28-8/gemini-patient-note.js
    note: 환자 이름과 진단을 Gemini 로 보낸다(CommonJS)
    expect: needs-review
    ai: {no-personal-data-sent: no}
  - file: pipa-28-8/provider-url-fetch.ts
    note: SDK 없이 API 주소를 바로 부른다
    expect: needs-review
    ai: {no-personal-data-sent: no}
  - file: pipa-28-8/embeddings-of-profiles.ts
    note: 생성이 아니라 임베딩이어도 보내는 것은 이전이다
    expect: needs-review
    ai: {no-personal-data-sent: no}
  - file: pipa-28-8/langchain-chat.ts
    expect: needs-review
    ai: {no-personal-data-sent: no}
  - file: pipa-28-8/responses-api.ts
    note: OpenAI Responses API
    expect: needs-review
    ai: {no-personal-data-sent: no}
  - file: pipa-28-8/transcribe-call.ts
    note: 음성 파일을 보내는 받아쓰기
    expect: needs-review
    ai: {no-personal-data-sent: no}
  - file: pipa-28-8/translate-voice-memo.ts
    expect: needs-review
    ai: {no-personal-data-sent: no}
  - file: pipa-28-8/moderate-profile.js
    note: 모더레이션도 내용을 보낸다(CommonJS)
    expect: needs-review
    ai: {no-personal-data-sent: no}
  - file: pipa-28-8/gemini-stream.ts
    expect: needs-review
    ai: {no-personal-data-sent: no}
  - file: pipa-28-8/anthropic-require-stream.js
    note: require 로 가져온 Anthropic SDK 의 messages.stream
    expect: needs-review
    ai: {no-personal-data-sent: no}
  - file: pipa-28-8/anthropic-named-import.ts
    expect: needs-review
    ai: {no-personal-data-sent: no}
  - file: pipa-28-8/axios-provider-url.ts
    expect: needs-review
    ai: {no-personal-data-sent: no}
  - file: pipa-28-8/ai-sdk-embed.ts
    note: AI SDK 의 embedMany
    expect: needs-review
    ai: {no-personal-data-sent: no}
  - file: pipa-28-8/responses-stream-named-import.ts
    expect: needs-review
    ai: {no-personal-data-sent: no}
  - file: pipa-28-8/responses-require.js
    expect: needs-review
    ai: {no-personal-data-sent: no}
  - file: pipa-28-8/langchain-stream.ts
    expect: needs-review
    ai: {no-personal-data-sent: no}
  - file: pipa-28-8/langchain-batch.ts
    expect: needs-review
    ai: {no-personal-data-sent: no}
  - file: pipa-28-8/korean-label-1.ts
    note: 개인정보 신호가 한국어 낱말 하나뿐인 프롬프트
    expect: needs-review
    ai: {no-personal-data-sent: no}
  - file: pipa-28-8/korean-label-2.ts
    expect: needs-review
    ai: {no-personal-data-sent: no}
  - file: pipa-28-8/korean-label-3.ts
    expect: needs-review
    ai: {no-personal-data-sent: no}
  - file: pipa-28-8/korean-label-4.ts
    expect: needs-review
    ai: {no-personal-data-sent: no}
  - file: pipa-28-8/korean-label-5.ts
    expect: needs-review
    ai: {no-personal-data-sent: no}
  - file: pipa-28-8/redact-before-send.ts
    note: >
      이름만 본 약한 대안(masked-before-send)은 혼자 풀지 못한다. 판정자가 가린 값을 보내는 줄을 인용해야 풀린다
    expect: compliant
    ai:
      no-personal-data-sent: {answer: yes, cite: 'const safeBody = redactPii(ticket.body, { remove: ["email", "phone"] });'}
  - file: pipa-28-8/unmask-not-a-mask.ts
    note: 이름에 mask 가 들었지만 가리는 함수가 아니다. 약한 대안이라 판정자가 '아니오'면 경고로 남는다
    expect: needs-review
    ai: {no-personal-data-sent: no}
  - file: pipa-28-8/prompt-without-personal-fields.ts
    note: 이메일은 로그에만 쓰고 프롬프트에는 상품 정보만 넣는다. 판정자가 프롬프트 줄을 인용해 푼다
    expect: compliant
    ai:
      no-personal-data-sent:
        answer: yes
        cite: 'messages: [{ role: "user", content: `상품 설명을 써 주세요. 상품명 ${product.title}, 사양 ${product.specs}` }],'
  - file: pipa-28-8/no-personal-data.ts
    note: 개인정보로 읽히는 이름이 없다(기사 요약)
    expect: not-applicable
  - file: pipa-28-8/domestic-provider.ts
    note: 국내 사업자(HyperCLOVA X)의 API 는 보지 않는다
    expect: not-applicable
  - file: pipa-28-8/twilio-with-openai-types.ts
    note: >
      openai 의 타입만 가져오고 Twilio 로 문자를 보낸다. messages.create 는 @anthropic-ai/sdk 를 가져온 파일에서만
      AI 호출로 센다
    expect: not-applicable
  - file: pipa-28-8/client-from-local-module.ts
    note: >
      알려진 한계(놓침). 클라이언트를 자체 모듈(@/lib/anthropic)에서 가져오면 국외 사업자 모듈 이름이 이 파일에
      없다. 에이전트 검토의 찾기 단계가 볼 몫이다
    expect: not-applicable
  - file: pipa-28-8/chat-text-only.ts
    note: >
      알려진 한계(놓침). 이용자의 대화를 그대로 보내지만 개인정보로 읽히는 이름이 없다. 대화에 적은 개인정보는
      코드로 알 수 없다
    expect: not-applicable
