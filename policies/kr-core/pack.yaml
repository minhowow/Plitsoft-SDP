# 국내 법·정책 검토 팩 — 정책 팩 문법 v0.3
#
# 조문 추적성
#   text-file 은 국가법령정보 공동활용 API 로 받은 조문 원문이고, text-sha256 은 그 파일의 해시다.
#   원문 파일이 적어 둔 해시와 달라지면 `policypack validate` 가 경고한다. 법이 개정됐는지는 원문을 다시
#   받아야 안다. 받는 도구는 지금 저장소에 없고 태그 archive/research-2026-09-29 의 src/policypack/legal.py
#   에 있다. 파일 모양은 첫 줄 '<법령명> <조문>(<제목>)', 둘째 줄 '시행 YYYY-MM-DD', 빈 줄, 조문이다.
#   해시로 고정되는 것은 violated-when-failed 목록뿐이다. 그래서 규칙의 모양을 정하는
#   시행령 조문(예외 매체, 표시 방법)도 이 목록에 넣는다. 맨 앞 항목이 판정에 붙는 대표 조문이다.
#   effective-from 은 받은 판본의 시행일, 곧 원문 파일 머리의 '시행' 줄이다. 그 조문의 의무가 처음
#   생긴 날이 아니다(예: 시행령 제61조 ② 는 2014년에 신설됐고 받은 판본의 시행일은 2026-07-07 이다).
#
# 이용자에게 보이는 글
#   title, ask-developer, rationale, AI 질문, on-unsatisfied 는 보고서에 실리거나 판정자에게 그대로 간다.
#   여기에는 이 정책이 원문을 고정한 조문만 번호로 적는다(tests/test_pack_schema.py 가 지킨다). 고정하지
#   않은 조문·부칙·제재·기관 해석은 주석에만, 출처(받은 날짜나 그 기록이 있는 곳)와 함께 둔다.
#   예외는 시행령 별표 6 하나다(kr.network-act.50-4). 원문을 아직 고정하지 못했고, 그 사실을 그 정책의
#   rationale 에 밝혔다.

apiVersion: policypack/v0.3

pack:
  id: kr-core
  title: 국내 법·정책 검토 팩

defaults:
  languages: [javascript, typescript]

policies:
  # ───────────────────────────────────────────────────────────────────────────
  - id: kr.pipa.22-2
    category: child-consent
    title: 만 14세 미만 아동의 개인정보 처리
    ask-developer: 만 14세 미만 사용자를 받는다면 법정대리인 동의를 확인하거나 가입을 막고 있나요?

    legal:
      violated-when-failed:
        - statute: 개인정보 보호법
          article: 제22조의2
          clause: 제1항
          url: https://www.law.go.kr/법령/개인정보보호법
          text-file: _legal/pipa-22-2.txt
          text-sha256: 0678277a76b6f209fa0c4469764752e9956214be59fcd8c2ce4551c861fb8fad
          text-retrieved: '2026-09-20'
          effective-from: '2026-09-11'
          law-id: '011357'
    review:
      review-by: 2027-09-20
    rationale:
      motivation: >
        연령 확인 없이 가입을 받으면 아동의 개인정보를 법정대리인 동의 없이 수집하게 된다.
      implementation: 연령 분기 또는 보호자 동의 검증 호출이 가입 경로에 있는지 확인한다

    rules:
      - id: signup-without-guard
        applies-when:
          # 가입 맥락. 파일 전체의 낱말(register·join)이 아니라 가입을 가리키는 코드 모양을 본다: 가입 문구, 가입
          # 경로 문자열, 가입 이름의 함수 정의·호출. path.join·registerCleanup·react-hook-form 의 register() 는 세지
          # 않는다(dev 평가 2026-09-30: CLI 도구의 잠금 파일·경로 코드가 가입으로 읽혔다).
          # 경로 문자열은 signup·register·join 으로 끝나는(또는 그 뒤에 하위 경로가 붙는) 문자열이다. 슬래시가 없는
          # 낱말 하나("join", "register")도 센다. NestJS 데코레이터(@Post("join")), 기준 주소를 둔 클라이언트의
          # 상대 경로(api.post("register", …)), 중첩 라우트(path: "join")가 그렇게 적는다. 그래서 SQL 조각 "JOIN" 과
          # 소켓 이벤트 "join" 도 가입 맥락으로 읽힌다(알려진 한계, 픽스처 join-word-not-signup.ts). 2026-10-07 에
          # 슬래시가 앞에 있는 꼴로 좁혔다가, 나이를 받는 실제 가입을 놓치는 것이 확인되어 되돌렸다. dev 저장소
          # 20개에서는 어느 쪽이든 경고가 같다.
          # 앞의 signup-hint 는 정규식 하나짜리 거름막이다. signup-context 의 세 갈래가 쓰는 낱말을 모두 담는다(고칠
          # 때는 함께 고친다). signup-context 는 구문 패턴이 섞여 있어 파싱이 안 된 파일에서 '모름'이 된다. 그러면
          # 나이 조건만으로 가입과 무관한 파일(프로필 화면의 birthday)이 '불확실'로 남는다. 가입 낱말이 하나도 없는
          # 파일은 이 거름막이 파싱과 무관하게 '거짓'으로 돌려보낸다.
          - id: signup-hint
            static:
              pattern-regex: (?i)회원\s*가입|sign[-_]?up|register|join
          - id: signup-context
            static:
              pattern-either:
                - pattern-regex: 회원\s*가입
                - pattern-regex: (?i)["'`]/?(?:[\w-]+/)*(sign-?up|register|join)(/[^"'`\n]*)?["'`]
                - patterns:
                    - pattern-either:
                        - pattern: function $F(...) { ... }
                        - pattern: const $F = $E
                        - pattern: $F(...)
                        - pattern: $O.$F(...)
                    - metavariable-regex:
                        metavariable: $F
                        regex: (?i)^\w*(sign_?up|register_?(user|member|account)|join_?(member|us|form))\w*$
          # 생년월일·나이를 받는가. birth 가 든 이름(birthDate, userBirth, yearOfBirth)과 dob 로 시작하는 이름(dob,
          # dobYear)은 어디에 쓰였든 센다(상태 변수, 줄여 쓴 속성 { email, birthDate }, 필드 선언, 멤버 접근). 주석과
          # 같은 파일의 다른 함수에 있는 이름도 센다(알려진 한계, 픽스처 birthday-comment-only.tsx ·
          # birthday-other-function.js). age 는 흔한 낱말이라 필드로 받는 모양만 센다: 필드 선언(age:), 필드 이름
          # 문자열("age"), 멤버 접근(user.age). 지역 변수(const age = Date.now() - mtime)와 HTTP max-age 는 세지
          # 않는다. 한국어 문구는 '생년월일'을 센다.
          # 정규식만 쓴다 — 파싱이 일부 실패한 파일에서도 이 조건의 '거짓'을 믿을 수 있어야 가입과 무관한 파일이
          # '불확실'로 남지 않는다(dev 평가 2026-09-30).
          # '만 14세' 문구는 여기서 세지 않는다. 나이를 받는다는 신호가 아니라 연령을 확인한다는 신호다. 여기서
          # 세면 '[필수] 만 14세 이상입니다' 항목을 둔 가입 화면이 그 항목 때문에 경고를 받는다(dev 평가
          # 2026-10-06). 아래 약한 대안 age-gate-text 가 그 문구를 본다. 그래서 나이를 받지 않고 이 문구만 있는
          # 가입에는 규칙이 적용되지 않는다 — 나이를 묻지 않는 가입을 이 규칙은 보지 않는다. 나이를 받더라도 이
          # 조건이 알아보지 못하는 모양(줄여 쓴 속성 { email, age }, 상태 변수 age, '생일'·'출생연도' 라벨뿐인 입력)
          # 이면 문구가 있어도 적용되지 않는다(알려진 한계, 픽스처 age-shorthand-notice.tsx).
          - id: birth-or-age
            static:
              pattern-regex: (?i)생년월일|birth|(?<![-\w])dob\w*|(?<![-\w.])age\??\s*:\s*\S|["']age["']|\.age\b

        applies-ai:
          question: 이 코드는 생년월일이나 나이를 받아 회원 가입을 처리하는가?

        compliant-if-any:
          - id: under14-branch
            # 강한 대안이라 혼자 경고를 푼다. 애매하면 받지 않고 AI 로 넘긴다.
            # - $X 는 사람의 나이로 읽히는 모양만 받는다: age·userAge·years·yearsOld 같은 이름(사람을 가리키는
            #   받는 쪽의 .age 포함), getAge·calcKoreanAge 같은 나이 계산 호출, differenceInYears·diff(…, "year"),
            #   생년(birth…)이 든 식. 이름 끝의 Age 만 보면 domainAge·sessionAgeSec·accountAge·CACHE_MAX_AGE 가,
            #   길이만 보면 password.length·agent.length 가 연령 분기로 읽힌다.
            # - 분기 안에서 막아야 한다: 맨 윗단의 return(true·false 제외)·throw, 또는 보호자·동의 확인 호출이나
            #   redirect. 분기에서 로그만 남기고 가입시키는 코드는 준수가 아니다.
            static:
              patterns:
                - pattern-either:
                    - pattern: if ($X < 14) $BODY
                    - pattern: if ($X < 14 && $Y) $BODY
                    - pattern: if ($X <= 13) $BODY
                - metavariable-regex:
                    metavariable: $X
                    regex: ^(?!.*\.length\s*$)(?:(?:(?:Number|parseInt)\(\s*)?(?:(?:user|member|child|customer|applicant|body|profile|input|data|form|values|dto|params|payload|person|req\.body|this)\.)*(?:age|ageYears|ageInYears|userAge|memberAge|childAge|koreanAge|manAge|koreanManAge|fullAge|currentAge|internationalAge|years|yrs|yearsOld|나이|만나이)(?:\s*(?:,\s*10\s*)?\))?|(?:[\w$]+\.)*(?:get|calc|calculate|compute)(?:User|Member|Child|Korean|Man|KoreanMan|Full|International|Current)?Age(?:From\w*|In\w*)?\s*\(.*\)|.*\bdifferenceIn(?:Calendar)?Years\s*\(.*|.*\.diff\(.*['"]years?['"].*\)|.*[Bb]irth\w*.*)$
                - metavariable-regex:
                    metavariable: $BODY
                    regex: (?s)^(?:(?:\{(?:"(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*'|`(?:\\.|[^`\\])*`|//[^\n]*|/\*.*?\*/|[^{}"'`/]|/(?![/*])|(\{(?:"(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*'|`(?:\\.|[^`\\])*`|//[^\n]*|/\*.*?\*/|[^{}"'`/]|/(?![/*])|(?1))*\}))*?(?<=[;{}])(?:\s|//[^\n]*|/\*.*?\*/)*)?(?:return\b(?!\s*\(?\s*(?:true|false|!0|!1)\b)|throw\b)|.*(?i:guardian|parent|legalrep|consent)\w*\s*\(|.*(?:법정대리인|보호자)\w*\s*\(|.*\b(?:redirect|replace)\s*\()
            on-unsatisfied:
              message: 만 14세 미만을 가르는 연령 분기가 보이지 않습니다.
              ask-developer: 이 가입 흐름에서 만 14세 미만 사용자를 어떻게 가려내나요?
              remediation: 생년월일로 만 나이를 계산해 14세 미만 분기를 두세요.

          - id: guardian-call
            strength: weak
            static:
              patterns:
                - pattern: $F(...)
                - metavariable-regex:
                    metavariable: $F
                    regex: (?i).*(guardian|parent|legal_?rep|under_?14).*
            on-unsatisfied:
              message: 보호자 동의를 확인하는 것으로 보이는 함수 호출이 없습니다.
              ask-developer: 법정대리인 동의를 확인하는 함수 이름이 무엇인가요?

          # '만 14세 이상입니다' 같은 자기 확인 항목, '만 14세 미만은 가입할 수 없습니다' 같은 안내 문구.
          # 문구가 있다는 것만으로는 그 확인이 가입을 실제로 막는지 알 수 없다(약관에만 적어 둔 문장이나 주석일 수
          # 있다). 그래서 약한 대안이다. 판정자의 '예'와 실재하는 줄의 인용이 있어야 풀리고, 판정자가 없으면
          # '불확실'로 남는다. 관문은 인용한 줄이 코드에 있는지만 보므로, 풀린 판정은 보고서의 'AI 가 해제한 경고'에
          # 남겨 사람이 본다. 자기 확인 항목만으로 충분한지는 사람이 정한다.
          - id: age-gate-text
            strength: weak
            static:
              pattern-regex: (?<!\d)(?:만\s*)?14\s*세\s*(?:이상|미만)
            on-unsatisfied:
              message: 가입자가 만 14세 이상인지 확인하는 항목(예 '만 14세 이상입니다' 필수 체크)이 보이지 않습니다.
              ask-developer: 가입자가 만 14세 이상인지 어디서 확인하고, 확인하지 않으면 가입이 막히나요?

          - id: ai-guard
            ai:
              question: 이 코드에 만 14세 미만 사용자의 가입을 막거나 법정대리인 동의를 확인하는 처리가 있는가?
              evidence: required
            on-unsatisfied:
              message: 보호자 동의 또는 가입 차단 처리를 찾지 못했습니다.
              ask-developer: 만 14세 미만 사용자의 법정대리인 동의를 어디서 받나요?
              remediation: 연령 확인 뒤 보호자 동의 절차를 가입 완료 이전에 넣으세요.

  # ───────────────────────────────────────────────────────────────────────────
  - id: kr.network-act.50-3
    category: ads-night-send
    title: 야간(21시~08시) 광고성 정보 전송의 별도 동의
    ask-developer: 이 광고가 오후 9시~다음 날 오전 8시에 문자·푸시·알림톡 등으로 나갈 수 있다면, 그 시간대 수신에 별도 동의를 받았나요? (전자우편으로만 보내는 광고는 이 요건의 예외입니다)

    legal:
      violated-when-failed:
        # 제50조 ③ 은 "오후 9시부터 그 다음 날 오전 8시까지" 별도 사전 동의를 요구한다.
        # "제1항에도 불구하고" 라서 ① 단서(거래관계 등)로 사전 동의가 면제돼도 ③ 은 그대로다.
        # 단서가 있다: "다만, 대통령령으로 정하는 매체의 경우에는 그러하지 아니하다."
        # 시행령 제61조 ② 가 그 매체를 정한다: "전자우편을 말한다."
        # → 적용 조건 send-call 이 전자우편 발송 호출을 세지 않는다(아래 규칙 참고).
        #   전자우편으로만 보내는 파일은 해당 없음, 문자·푸시 등과 함께 보내면 그대로 적용.
        - statute: 정보통신망 이용촉진 및 정보보호 등에 관한 법률
          article: 제50조
          clause: 제3항
          url: https://www.law.go.kr/법령/정보통신망이용촉진및정보보호등에관한법률
          text-file: _legal/network-act-50.txt
          text-sha256: b54539a223fa635fa66c98a6098f388aff45755a268ebb402533a5245ea1394c
          text-retrieved: '2026-09-20'
          effective-from: '2026-09-11'
          law-id: '000030'
        # 위반되는 조문이 아니라 ③ 단서를 채우는 조문이다. 그래도 여기 둔다. 해시로 고정되는
        # 목록이 이것뿐이라, 시행령이 예외 매체를 바꾸면 validate 가 경고해야 send-call 의
        # 전자우편 제외가 낡은 줄 안다. 두 번째 항목이라 판정의 대표 조문은 그대로 법 제50조③ 이다.
        # effective-from 은 API 가 돌려준 시행령 판본의 시행일이다. ② 자체는 <신설 2014.11.28>.
        - statute: 정보통신망 이용촉진 및 정보보호 등에 관한 법률 시행령
          article: 제61조
          clause: 제2항
          url: https://www.law.go.kr/법령/정보통신망이용촉진및정보보호등에관한법률시행령
          text-file: _legal/network-act-decree-61.txt
          text-sha256: aea5f6c682c613549e828e75e516144d9abe6fdf1c149634ea74b3976213584d
          text-retrieved: '2026-09-22'
          effective-from: '2026-07-07'
          law-id: '004797'
    review:
      review-by: 2027-09-22
    rationale:
      motivation: >
        낮 시간 수신 동의만 받아 두고 야간에 발송하면 별도 동의 요건을 건너뛰게 된다.
        법 제50조 제3항 단서와 시행령 제61조 제2항이 전자우편을 이 요건에서 뺀다.
      implementation: >
        광고 표기와 전자우편이 아닌 발송 호출이 함께 있는 파일에서, 발송 호출을 감싸는 가장 바깥 함수마다 그 함수
        안에 야간 차단, 주간 전용 스케줄, 또는 야간 동의 확인이 있는지 본다. 그 함수 밖(호출하는 쪽, 다른 함수,
        다른 파일)에 있는 가드와 스케줄은 보지 못해 검토 필요로 남는다

    rules:
      - id: ad-send-without-night-guard
        # 파일이 아니라 발송 호출을 감싸는 가장 바깥 함수마다 판정한다. 파일 단위로 보면 가드가 있는 발송 하나가
        # 같은 파일의 다른 광고 발송까지 풀었다(2026-10-06 탐침: 주간 가드가 있는 발송과 가드 없는 반짝 세일
        # 발송이 한 파일에 있으면 경고가 없었다).
        # 막지 못하는 것(픽스처 two-schedules-in-one-function.ts · top-level-send-guard-elsewhere.ts): 두 발송이
        # 같은 바깥 함수 안에 있으면(스케줄을 한꺼번에 거는 함수, 라우터를 묶는 함수, 컴포넌트) 한쪽의 가드가
        # 다른 쪽까지 푼다. 발송이 모두 함수 밖인 파일은 파일 전체로 판정한다.
        # 대가: 광고와 인증번호를 한 파일에서 보내면 인증번호 함수에도 경고가 난다. 스케줄을 발송 함수 밖에서
        # 거는 코드(큐에 반복 작업을 넣는 쪽과 꺼내 보내는 쪽이 다른 함수, 이름 있는 처리기를 스케줄에 거는 줄)는
        # 주간 스케줄이어도 경고가 난다. 발송 함수가 여럿인 파일은 함수마다 경고가 따로 나고 판정자에게도 함수마다
        # 따로 묻는다. 모두 사람이 넘길 수 있는 쪽의 오류다. 함수 경계는 이 규칙이 걸릴 수 있는 파일에서만
        # 구하므로(엔진의 두 번째 실행) 광고 발송이 없는 파일의 검사 시간은 늘지 않는다.
        scope: anchor
        anchor-on: send-call
        applies-when:
          # 광고 표시. '(광고)' 와 흔히 쓰는 '[광고]' 에 더해, 빈칸·부호를 넣거나 전각 괄호를 쓴 변형
          # ('(광 고)', '[광.고]', '（광고）')도 센다. 여기서는 광고인지를 가리는 신호라 넓게 센다. 표기가
          # 맞는지는 kr.network-act.50-4 가 따로 보고 '(광고)' 만 인정한다. 표시를 비틀어도 광고는 광고다
          # (별표 6 공통 1 은 "수신자의 수신의 거부 또는 수신동의의 철회를 회피하기 위한 목적으로
          # 빈칸ㆍ부호ㆍ문자 등을 삽입하거나 표시방법을 조작하는 조치"를 금지한다. 목적 요건이 붙으므로
          # 회피 목적인지는 도구가 판단하지 않는다. 별표 6 의 출처는 kr.network-act.50-4 의 주석에 있다).
          # 괄호 사이의 틈에 한글은 넣지 않는다. Semgrep 의 \W 는 한글 음절까지 건너뛰어 '(광주 최고)' 에도
          # 맞는다. kr.network-act.50-4 가 같은 식을 쓴다.
          # 발송 대행사의 광고 표시(NCP SENS contentType "AD", 솔라피 친구톡 adFlag, NHN 친구톡 isAd)는
          # 코드가 스스로 이 메시지를 광고라고 밝힌 것이다. 적용을 올리기만 하고 대안으로는 쓰지 않는다.
          # 정규식 하나로 둔다. 그래야 파싱이 안 되는 파일에서도 값이 나온다(generic 사본). AST 패턴을
          # 섞으면 일부가 파싱되지 않은 파일마다 '모름'이 되어 불확실 경고가 쏟아진다.
          - id: ad-marker
            static:
              pattern-regex: '[\(\[（［【][ \t]*광[ \t·.\-_*]*고[ \t]*[\)\]）］】]|\bcontentType["'']?[ \t]*:[ \t]*["'']AD["'']|\b(?:adFlag|isAd)["'']?[ \t]*:[ \t]*true\b'
          # 발송 호출. 두 갈래 중 하나면 참이다.
          #
          # (가) 이름이 send·push·notify 로 시작하는 메서드 호출. 받는 쪽을 모르는 `sms.send(...)`·
          #     `kakao.sendAlimtalk(...)` 도 센다(적용으로 두는 쪽). 여기서 빼는 것은 두 가지다.
          #   1. 전자우편 발송(법 제50조③ 단서, 시행령 제61조②). SDK 모양이 분명한 호출만 뺀다.
          #      nodemailer sendMail · AWS SDK v2 SES 와 Postmark 의 sendEmail · Resend emails.send
          #      SES v3 send(new Send*EmailCommand(...)), 그리고 바로 앞 문장에서 만든 명령을 보내는 꼴
          #      제목(subject)과 html 을 함께 받는 호출, SendGrid dynamicTemplateData, 바로 앞 문장에서
          #      그런 객체를 만들어 보내는 꼴
          #      kr.network-act.50-4 의 email-send 가 전자우편으로 보는 모양과 짝을 맞춘다. 저쪽에만 있는
          #      Resend batch.send · 제목+template 호출은 여기서 빼지 않는다(모르면 적용으로 둔다).
          #   2. 받는 쪽이 코드에 드러난, 수신자에게 보내는 것이 아닌 호출. HTTP 응답(Express·Fastify 의
          #      경로 처리기 인자, NextApiResponse·Response 타입, res.status(...).send), 웹소켓(연결 처리기
          #      인자, new WebSocket), 라우터(useRouter·useHistory), 배열 리터럴의 push.
          #      제외 구역의 $X 는 위의 $X 와 묶여서 그 객체의 호출만 빠진다. 같은 처리기 안의 문자 발송은
          #      그대로 남는다(실측). 이름(res·ws·router)만 보고는 빼지 않는다.
          # 일부러 안 쓰는 신호
          #   - subject 만: 솔라피 LMS 도 subject 를 받는다. 문자를 전자우편으로 오인하면 규칙이 꺼진다
          #   - send([...]) 배열: 솔라피 문자 묶음 발송이 같은 모양이다
          #   - 이름만(mailer.sendNewsletter): 매체를 모른다. 적용으로 둔다
          #   - `...` 로 떨어진 명령·객체와 발송: pattern-not-inside 구간 사이의 문자 발송까지 지운다
          #     (실측). 그래서 바로 붙은 두 문장만 뺀다
          # 못 알아보는 전자우편 발송은 적용으로 남는다(경고를 올리는 쪽). 그때 ask-developer 가 예외를 알린다.
          #
          # (나) 매체가 드러난 문자·푸시·메신저 발송(Twilio messages.create, OneSignal createNotification,
          #     문자 게이트웨이로 가는 fetch·axios.post 등). 이름이 send* 가 아니어도 센다. 전자우편과 함께
          #     보내는 파일에서 (가) 가 전자우편 호출을 빼고 나면 이 갈래가 문자·푸시를 잡는다.
          #     kr.network-act.50-4 의 nonemail-send 가 이 목록을 그대로 쓴다(YAML 별칭).
          - id: send-call
            static:
              pattern-either:
                - patterns:
                    - pattern: $X.$SEND(...)
                    - metavariable-regex:
                        metavariable: $SEND
                        regex: (?i)^(send\w*|push\w*|notify\w*)$
                    - pattern-not: $M.sendMail(...)
                    - pattern-not: $M.sendEmail(...)
                    - pattern-not: $M.emails.send(...)
                    - pattern-not: $M.send(new SendEmailCommand(...))
                    - pattern-not: $M.send(new SendRawEmailCommand(...))
                    - pattern-not: $M.send(new SendTemplatedEmailCommand(...))
                    - pattern-not: $M.send(new SendBulkTemplatedEmailCommand(...))
                    - pattern-not: $M.send(new SendBulkEmailCommand(...))
                    - pattern-not: '$M.$F({..., subject: $S, ..., html: $H, ...})'
                    - pattern-not: '$M.$F({..., dynamicTemplateData: $D, ...})'
                    - pattern-not-inside: |
                        $CMD = new SendEmailCommand(...);
                        $M.send($CMD);
                    - pattern-not-inside: |
                        $MSG = {..., subject: $S, ..., html: $H, ...};
                        $M.send($MSG);
                    - pattern-not-inside: |
                        $MSG = {..., dynamicTemplateData: $D, ...};
                        $M.send($MSG);
                    - pattern-not: $R.status(...).send(...)
                    - pattern-not-inside: |
                        $APP.$VERB("...", ..., ($REQ, $X, ...) => { ... })
                    - pattern-not-inside: |
                        $APP.$VERB("...", ..., async ($REQ, $X, ...) => { ... })
                    - pattern-not-inside: |
                        $APP.$VERB("...", ..., function ($REQ, $X, ...) { ... })
                    - pattern-not-inside: |
                        function $H(..., $X: NextApiResponse, ...) { ... }
                    - pattern-not-inside: |
                        (..., $X: NextApiResponse, ...) => { ... }
                    - pattern-not-inside: |
                        function $H(..., $X: Response, ...) { ... }
                    - pattern-not-inside: |
                        (..., $X: Response, ...) => { ... }
                    - pattern-not-inside: |
                        $WSS.on("connection", ($X, ...) => { ... })
                    - pattern-not-inside: |
                        $WSS.on("connection", function ($X, ...) { ... })
                    - pattern-not-inside: |
                        $X = new WebSocket(...);
                        ...
                    - pattern-not-inside: |
                        $X = useRouter(...);
                        ...
                    - pattern-not-inside: |
                        $X = useHistory(...);
                        ...
                    - pattern-not-inside: |
                        $X = [...];
                        ...
                - &nonemail-send
                  pattern-either:
                    - patterns:
                        - pattern: $X.$M(...)
                        - metavariable-regex:
                            metavariable: $M
                            regex: ^(sendOne|sendMany|sendEach|sendEachForMulticast|sendMulticast|sendToDevice|sendToTopic|sendPushNotificationsAsync|sendNotification|createNotification|sendFriendtalk|sendFriendTalk)$
                    - patterns:
                        - pattern-either:
                            - pattern: $M(...)
                            - pattern: $X.$M(...)
                        - metavariable-regex:
                            metavariable: $M
                            regex: ^send(Sms|SMS|Lms|LMS|Mms|MMS|Push|PushNotification|FriendTalk|Friendtalk)$
                    - patterns:
                        - pattern-either:
                            - pattern-inside: |
                                $S = new $CLS(...);
                                ...
                            - pattern-inside: |
                                class $C {
                                  ...
                                  $S = new $CLS(...);
                                  ...
                                }
                            - pattern-inside: |
                                class $C {
                                  ...
                                  constructor(...) {
                                    ...
                                    this.$S = new $CLS(...);
                                    ...
                                  }
                                  ...
                                }
                        - pattern-either:
                            - pattern: $S.send(...)
                            - pattern: this.$S.send(...)
                        - metavariable-regex:
                            metavariable: $CLS
                            regex: ^(SolapiMessageService|coolsms|Coolsms)$
                    - pattern: $A.messaging().send(...)
                    - pattern: getMessaging(...).send(...)
                    - patterns:
                        - pattern-either:
                            - pattern-inside: |
                                $S = $A.messaging();
                                ...
                            - pattern-inside: |
                                $S = getMessaging(...);
                                ...
                        - pattern: $S.send(...)
                    - pattern: |
                        $C.messages.create({..., to: $TO, ...})
                    - patterns:
                        - pattern-either:
                            - pattern-inside: |
                                $C = twilio(...);
                                ...
                            - pattern-inside: |
                                $C = require("twilio")(...);
                                ...
                            - pattern-inside: |
                                $C = new Twilio(...);
                                ...
                        - pattern: $C.messages.create(...)
                    # AWS SNS 문자. PhoneNumber 로 보내는 게시만 센다(주제 게시는 매체를 모른다)
                    - pattern: '$C.send(new PublishCommand({..., PhoneNumber: $P, ...}))'
                    - pattern: '$C.publish({..., PhoneNumber: $P, ...})'
                    # 문자·친구톡 게이트웨이. URL 을 그 자리에 적었거나(템플릿 리터럴 포함) 상수에 담았을 때.
                    # 상수는 Semgrep 의 상수 전파로 문자열 패턴이 맞는다(실측). 식별자 이름은 보지 않는다.
                    - patterns:
                        - pattern-either:
                            - pattern: fetch($URL, ...)
                            - pattern: $H.post($URL, ...)
                        - metavariable-regex:
                            metavariable: $URL
                            regex: (?i).*(sens\.apigw\.ntruss\.com|api-sms\.cloud\.toast\.com|sms\.api\.nhncloudservice\.com|api-alimtalk\.cloud\.toast\.com|alimtalk\.api\.nhncloudservice\.com|apis\.aligo\.in|kakaoapi\.aligo\.in|api\.coolsms\.co\.kr|api\.solapi\.com).*
                    - pattern: fetch("=~/(?i).*(sens\.apigw\.ntruss\.com|api-sms\.cloud\.toast\.com|sms\.api\.nhncloudservice\.com|api-alimtalk\.cloud\.toast\.com|alimtalk\.api\.nhncloudservice\.com|apis\.aligo\.in|kakaoapi\.aligo\.in|api\.coolsms\.co\.kr|api\.solapi\.com).*/", ...)
                    - pattern: $H.post("=~/(?i).*(sens\.apigw\.ntruss\.com|api-sms\.cloud\.toast\.com|sms\.api\.nhncloudservice\.com|api-alimtalk\.cloud\.toast\.com|alimtalk\.api\.nhncloudservice\.com|apis\.aligo\.in|kakaoapi\.aligo\.in|api\.coolsms\.co\.kr|api\.solapi\.com).*/", ...)

        compliant-if-any:
          # 시(hour) 칸이 8~20 의 한 값인 cron 식. 칸 수를 센다. 다섯 칸(분 시 일 월 요일)이면 둘째 칸,
          # 여섯 칸(초 분 시 일 월 요일 — node-cron·BullMQ repeat.pattern·cron 패키지가 이렇게 읽는다)이면
          # 셋째 칸이 시다. 칸 수를 보지 않으면 "0 15 22 * * *"(22시 15분)의 분 15 를 시로 읽는다.
          # 일곱 칸(연도)과 범위·목록(9-18, 10,22)은 맞지 않아 AI 로 넘어간다.
          - id: daytime-schedule
            static:
              patterns:
                - pattern-either:
                    - pattern: $C.schedule("$SPEC", ...)
                    - pattern: |
                        {..., pattern: "$SPEC", ...}
                    - pattern: |
                        {..., cron: "$SPEC", ...}
                - metavariable-regex:
                    metavariable: $SPEC
                    # 시(hour) 앞의 칸은 cron 글자(숫자 * ? / , -)여야 한다. 아무 글자나 받으면 식 앞에 적은
                    # 시간대 "TZ=UTC 0 12 * * *" 의 TZ=UTC 를 초 칸으로 읽는다. 서울로 적은 접두사만 받는다.
                    regex: ^\s*((CRON_)?TZ=Asia/Seoul\s+)?([\d*?/,-]+\s+)?[\d*?/,-]+\s+([89]|1\d|20)(\s+\S+){3}\s*$
                # 시간대를 서울이 아닌 곳으로 적은 스케줄은 받지 않는다. "0 12 * * *" 에 timezone "UTC" 면 한국
                # 시각 21시다. 옵션 객체의 timezone·tz·utc, 이어 부른 .timeZone(...), 식 앞의 TZ= 를 본다.
                # 시간대를 적지 않았거나 옵션 객체를 변수·전개·환경 변수로 넘긴 스케줄은 받는다 — 서버 시간대가
                # 한국이라고 보는 것이고, UTC 로 도는 서버에서는 틀린다(알려진 한계. night-hour-block 의
                # getHours() 도 같다).
                - pattern-not: |
                    $C.schedule("$SPEC", $FN, {..., timezone: "=~/^(?!Asia\/Seoul$)/", ...})
                # Firebase 예약 함수는 시간대를 객체가 아니라 이어 부른 .timeZone(...) 로 적는다
                - pattern-not-inside: |
                    $C.schedule("$SPEC", ...). ... .timeZone("=~/^(?!Asia\/Seoul$)/")
                - pattern-not: |
                    {..., pattern: "$SPEC", ..., tz: "=~/^(?!Asia\/Seoul$)/", ...}
                - pattern-not: |
                    {..., pattern: "$SPEC", ..., timezone: "=~/^(?!Asia\/Seoul$)/", ...}
                - pattern-not: |
                    {..., pattern: "$SPEC", ..., utc: true, ...}
                - pattern-not: |
                    {..., cron: "$SPEC", ..., utc: true, ...}
                - pattern-not: |
                    {..., cron: "$SPEC", ..., tz: "=~/^(?!Asia\/Seoul$)/", ...}
                - pattern-not: |
                    {..., cron: "$SPEC", ..., timezone: "=~/^(?!Asia\/Seoul$)/", ...}
            on-unsatisfied:
              message: 주간에만 발송한다고 볼 수 있는 스케줄 설정이 없습니다.
              ask-developer: 이 광고는 어떤 스케줄로 발송되나요?

          - id: night-consent-field
            strength: weak
            static:
              patterns:
                - pattern-either:
                    - pattern: $O.$K
                    - pattern: |
                        {..., $K: $V, ...}
                - metavariable-regex:
                    metavariable: $K
                    regex: (?i).*night.*(consent|agree|opt_?in).*
            on-unsatisfied:
              message: 야간 수신 동의를 담는 필드가 보이지 않습니다.
              ask-developer: 야간 수신 동의는 어디에 저장하나요?

          # 야간이면 **빠져나가고**, 그 뒤에 보내는 코드만 받는다. 강한 대안이라 혼자 경고를 풀므로 애매하면 받지
          # 않고 AI 로 넘긴다. 조건 모양만 보면 21~8시에만 광고를 보내는 코드도 '준수'가 된다. 받는 조건
          # (하나라도 빠지면 야간 발송 코드가 풀린다):
          # - 같은 문장 흐름에서 가드 **뒤에** 발송(send*·push*·notify*·publish*, messages.create, 게이트웨이로 가는
          #   post·fetch, bare send*())이 와야 한다(else 쪽 발송, return 하며 보내는 것도 된다). isNight()·
          #   sendWindow() 같은 도우미 안의 가드, 발송 뒤에 온 가드는 막지 않는다.
          # - 참(then) 쪽 맨 윗단에 return·continue·throw 가 있어야 한다. 안쪽 if 의 continue, 문자열·주석 속의
          #   '; return' 은 세지 않는다(중괄호 짝과 문자열·주석을 건너뛰는 정규식). return true·false 는 받지 않는다.
          # - 참 쪽에서 부르는 함수는 로그·지표·응답(res·reply)과 new 뿐이어야 한다. 그 안에서 푸시·큐 적재·다른
          #   발송 함수를 부르면 막는 것이 아니다. 이벤트 발행·운영 알림으로 미루는 적법한 코드도 여기서는 풀지
          #   않고 AI 가 본다.
          # - $H 는 시각으로 보이는 이름만, UTC 시각(getUTCHours·dayjs.utc·DateTime.utc·toISOString)은 받지 않는다.
          #   한국 시각 21시는 UTC 12시다. UTC 를 +9 로 바꿔 쓰는 적법한 코드도 AI 로 넘어간다.
          - id: night-hour-block
            static:
              patterns:
                - pattern-either:
                    - pattern-inside: |
                        if ($H >= 21 || $H < 8) $BODY
                        ...
                        $S;
                    - pattern-inside: |
                        if ($H >= 21 || $H < 8) $BODY
                        ...
                        return $S;
                    - pattern-inside: |
                        if ($H < 8 || $H >= 21) $BODY
                        ...
                        $S;
                    - pattern-inside: |
                        if ($H < 8 || $H >= 21) $BODY
                        ...
                        return $S;
                    - pattern-inside: |
                        if ($H >= 21 || $H < 8) { ... } else { ... $S; ... }
                    - pattern-inside: |
                        if ($H < 8 || $H >= 21) { ... } else { ... $S; ... }
                - pattern-either:
                    - pattern: if ($H >= 21 || $H < 8) $BODY
                    - pattern: if ($H < 8 || $H >= 21) $BODY
                - metavariable-pattern:
                    metavariable: $S
                    pattern-either:
                      - patterns:
                          - pattern: $X.$M(...)
                          - metavariable-regex:
                              metavariable: $M
                              regex: (?i)^(send\w*|push\w*|notify\w*|publish\w*|createNotification)$
                      - pattern: $X.messages.create(...)
                      - pattern: $X.post(...)
                      - pattern: fetch(...)
                      - patterns:
                          - pattern: $F(...)
                          - metavariable-regex:
                              metavariable: $F
                              regex: (?i)^send\w*$
                - metavariable-regex:
                    metavariable: $BODY
                    regex: (?s)^(?:\{(?:"(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*'|`(?:\\.|[^`\\])*`|//[^\n]*|/\*.*?\*/|[^{}"'`/]|/(?![/*])|(\{(?:"(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*'|`(?:\\.|[^`\\])*`|//[^\n]*|/\*.*?\*/|[^{}"'`/]|/(?![/*])|(?1))*\}))*?(?<=[;{}])(?:\s|//[^\n]*|/\*.*?\*/)*)?(?:return\b(?!\s*\(?\s*(?:true|false|!0|!1)\b)|continue\b|throw\b)
                - metavariable-regex:
                    metavariable: $BODY
                    regex: (?s)^(?!.*(?<![\w$.])(?!(?:this\.)?(?:console|logger|log|metrics|Sentry|res|reply|response|ctx)\b)(?!(?:if|for|while|switch|return|typeof|await|throw|catch|function|new)\b)(?<!\bnew\s)[A-Za-z_$][\w$]*(?:\??\.[\w$]+)*\s*\().*
                - metavariable-regex:
                    metavariable: $H
                    regex: (?i)^(?!.*utc)(.*hour.*|.*시각.*|.*시간.*|.*kst.*|hh?|hrs?|now)$
                - pattern-not-inside: |
                    $H = <... $D.getUTCHours() ...>;
                    ...
                - pattern-not-inside: |
                    $H = <... $X.utc(...) ...>;
                    ...
                - pattern-not-inside: |
                    $H = <... $D.toISOString() ...>;
                    ...
                - pattern-not-inside: |
                    $V = <... $X.utc(...) ...>;
                    ...
                    $H = <... $V ...>;
                    ...
            on-unsatisfied:
              message: 야간 시간대를 막는 검사가 없습니다.
              ask-developer: 야간에 발송되지 않도록 막는 곳이 어디인가요?

          - id: ai-night-guard
            ai:
              question: 이 광고 발송이 오후 9시~다음 날 오전 8시에 실행되지 않도록 막거나, 그 시간대 발송에 별도 수신 동의를 확인하는 처리가 있는가?
              evidence: required
            on-unsatisfied:
              message: 야간 발송을 막거나 야간 수신 동의를 확인하는 처리를 찾지 못했습니다.
              ask-developer: 이 발송이 21시~8시에 나갈 수 있나요? 그렇다면 그 시간대 동의는 어디서 받나요?
              remediation: 발송 직전에 실행 시각을 확인해 21시~8시면 건너뛰거나, 야간 동의 필드를 따로 확인하세요.

  # ───────────────────────────────────────────────────────────────────────────
  - id: kr.ai-basic-act.31
    category: ai-output-label
    title: 생성형 AI 결과물 표시
    ask-developer: >
      이 화면에 보이는 내용이 생성형 AI 결과물이라는 표시가 있나요? 화면 표시 대신 메타데이터·워터마크 같은
      기계 판독 표시를 쓴다면, AI 생성물이라는 사실을 이용자에게 한 번 이상 안내하나요? AI 활용 사실이
      서비스명·화면으로 명백하거나 내부 업무 용도로만 쓴다면 시행령 제23조 제4항의 예외가 적용될 수 있으니
      검토자에게 알려 주세요.

    legal:
      violated-when-failed:
        # 제31조는 의무가 셋이다. 이 정책은 ② 만 다룬다.
        #   ① 고영향·생성형 AI 기반 서비스라는 사실을 이용자에게 사전 고지
        #      → kr.ai-basic-act.31-1 이 생성형만 다룬다
        #   ② 생성형 AI 결과물이라는 사실을 표시        ← 이 정책
        #   ③ 실제와 구분하기 어려운 음향·이미지·영상은 명확히 인식할 수 있게 고지·표시
        #      (예술적·창의적 표현물은 향유를 저해하지 않는 방식으로 완화)
        # 그리고 ④ 가 "표시의 방법 및 그 예외"를 대통령령에 위임한다. 시행령 제23조가 받는다.
        #   ② 표시 방법은 둘 중 하나: "1. 사람이 인식할 수 있는 방법" 또는 "2. 기계가 판독할 수
        #      있는 방법. 이 경우 ... 1회 이상 안내 문구ㆍ음성 등으로 제공해야 한다."
        #      → 1호는 대안 label-text·ai-label, 2호는 대안 ai-machine-mark. 2호는 표시와 안내가
        #        둘 다 있어야 하므로 표시만 보는 조건은 대안으로 두지 않는다.
        #   ④ 1. AI 활용 사실이 명백한 경우 2. 내부 업무 용도로만 쓰는 경우 3. 과학기술정보통신부
        #      장관 고시(2026-09-22 행정규칙 Open API 검색 기준 아직 없음)에는 "제1항부터 제3항까지의
        #      규정 중 전부 또는 일부를 적용하지 않을 수 있다".
        #      → 경고를 푸는 대안으로 두지 않는다. ④ 가 적용을 빼는 것은 시행령 자신의 방법 규정이고,
        #        법 제31조②의 의무까지 없어지는지는 해석이라 사람에게 남긴다. 정책의 ask-developer 가
        #        이 예외를 알린다.
        - statute: 인공지능 발전과 신뢰 기반 조성 등에 관한 기본법
          article: 제31조
          clause: 제2항
          url: https://www.law.go.kr/법령/인공지능발전과신뢰기반조성등에관한기본법
          text-file: _legal/ai-basic-act-31.txt
          text-sha256: a3e9fa7e1fd0835e8dc453c00136038b42d8ac113589f78a10d0fc1b989ac891
          text-retrieved: '2026-09-20'
          effective-from: '2026-01-22'
          law-id: '014820'
        # ② 의 표시 방법(제2항)과 예외(제4항)를 정하는 조문. 대안의 모양이 여기서 나온다.
        # 해시로 고정해야 시행령이 방법을 바꿀 때 validate 가 알린다. 두 번째 항목이라
        # 판정의 대표 조문은 그대로 법 제31조② 다.
        # effective-from 은 받은 판본(제36580호)의 시행일 2026-08-20 이고 원문 파일의 '시행' 줄과 같다.
        # 제23조 자체는 그 전부터 시행 중이다. 부칙 <제36053호,2026.1.21> 제1조 "이 영은 2026년 1월
        # 22일부터 시행한다", 그리고 제23조는 그 뒤 개정되지 않았다(2026-09-23 API: 조문변경여부 N,
        # 개정 이력 없음. 제36580호는 제2조제2호나목만 고쳤다). 부칙은 이 팩에 고정하지 않았으므로
        # 2026-01-22 를 이용자에게 보이는 자리에 적지 않는다(2026-10-06 까지는 손으로 적었다).
        # 판본 날짜가 원문 파일에 들어가므로 시행령의 다른 조문만 개정돼도 원문을 다시 받으면 해시가
        # 어긋난다. 그때는 제23조를 다시 읽고 해시와 effective-from 을 새 판본에 맞춘다.
        - statute: 인공지능 발전과 신뢰 기반 조성 등에 관한 기본법 시행령
          article: 제23조
          clause: 제2항
          url: https://www.law.go.kr/법령/인공지능발전과신뢰기반조성등에관한기본법시행령
          text-file: _legal/ai-basic-act-decree-23.txt
          text-sha256: 2f8929570eff16fb80411da1160fe786af564b84d3f61b201e72996850938a07
          text-retrieved: '2026-09-22'
          effective-from: '2026-08-20'
          law-id: '015032'
    review:
      review-by: 2027-09-22
    rationale:
      motivation: >
        모델 응답을 그대로 렌더링하면서 표시를 넣지 않으면 이용자가 사람이 쓴 것으로 오인할 수 있다.
      implementation: >
        모델 응답을 렌더링하는 컴포넌트에 표시 문구나 표시 컴포넌트가 함께 있는지, 또는 결과물에 기계 판독
        표시를 넣으면서 AI 생성물이라는 안내를 한 번 이상 하는지 본다

    rules:
      - id: ai-output-without-label
        applies-when:
          # 이름·문자열만 보는 문턱(정규식이라 파싱 실패와 무관하다). AI 이름 신호에 더해 AI SDK 채팅 화면
          # (useChat from "ai/react", fetch("/api/chat"))도 잡도록 생성 모듈 import 와 생성 호출·엔드포인트
          # 모양을 넣었다. 경고를 올리는 쪽으로만 넓힌 것이다.
          #   - 'openai' 모듈 import 는 넣지 않았다. 임베딩 검색 화면도 같은 import 를 쓴다. OpenAI 생성
          #     호출은 .chat.completions. 와 모델 이름(gpt-…)으로 잡힌다
          #   - 엔드포인트는 맨 /api/chat·/api/generate 만 넣었다. /api/completions 는 강의 수료 같은 것도
          #     그 이름을 써서 뺐다. /api/chat 을 부르는 사람 상담 채팅도 걸린다(알려진 오탐)
          #   - 이름 신호는 대소문자를 가려 본다. (?i)\bai[a-z_]\w* 로 두면 Airplane·aim·aid 에도 맞는다.
          #     그래서 (?-i:) 안에서 ai/Ai/AI 뒤에 대문자나 밑줄이 오는 꼴만 센다 — aiEnabled·AiBrainIcon·
          #     AIComponents·AI_KEY 는 그대로 걸리고 Airplane·airplane·aim 은 빠진다.
          #     assistant 도 소문자 낱말(채팅 역할)과 Assistant+대문자(AssistantMessage)만 센다.
          #     홑낱말 Assistant 는 글꼴 이름(FONT_FAMILY.Assistant)과 메뉴 항목("Word Assistant")이라 뺐다.
          #   - 남은 알려진 오탐: AiCoursePage 처럼 Ai+대문자인 이름(AI 를 부르지 않는 강의 소개)은
          #     그대로 걸린다. 경고를 올리는 쪽이라 그대로 둔다. 픽스처 ai-course-page-nolabel.tsx
          - id: ai-source
            # 이 파일이 생성형 AI 를 쓰거나 그 결과를 받는가. 글자 모양이 아니라 코드 모양으로 본다: 생성 전용 AI SDK 를
            # 가져오거나, 생성 호출을 하거나, AI·모델 엔드포인트를 부르거나, 이름이 AI 인 훅·함수·컴포넌트를 부르거나
            # 그린다. openai 를 가져오기만 하는 것은 세지 않는다 — 임베딩·검열에도 쓴다(생성 호출 모양으로 센다).
            # 컴포넌트 자신의 이름(AiCoursePage)도 세지 않는다 — AI 를 가르치는 강의 소개 화면이 걸렸다.
            # 낱말 모양 정규식(\bAi[A-Z]\w*)은 아이콘 묶음의 AiOutlineUser 같은 이름에도 걸렸다(dev 평가 2026-09-30).
            # react-icons/ai 는 이름이 Ai 로 시작하는 아이콘을 내보내는 널리 쓰는 묶음이라 뺀다.
            static:
              pattern-either:
                - patterns:
                    - pattern-either:
                        - pattern: import $X from "$M"
                        - pattern: import { ... } from "$M"
                        - pattern: import * as $X from "$M"
                        - pattern: require("$M")
                    - metavariable-regex:
                        metavariable: $M
                        regex: ^(ai(/[\w-]+)?|@ai-sdk/[\w-]+|@anthropic-ai/[\w-]+|@google/(genai|generative-ai)|@langchain/[\w-]+|langchain(/.*)?|@aws-sdk/client-bedrock-runtime|@mistralai/[\w-]+)$
                # 생성 호출 가운데 AI 에만 있는 모양. messages.create·responses.create 는 문자(twilio)·설문 SDK 에도
                # 있어 넣지 않는다
                - pattern-either:
                    - pattern: $C.chat.completions.create(...)
                    - pattern: $C.chat.completions.stream(...)
                    - pattern: $C.models.generateContent(...)
                    - pattern: $C.models.generateContentStream(...)
                # 모양이 겹치는 호출(images.generate 등)은 부르는 객체가 AI 클라이언트일 때만
                - patterns:
                    - pattern-either:
                        - pattern: $C.images.generate(...)
                        - pattern: $C.images.edit(...)
                        - pattern: $C.responses.create(...)
                        - pattern: $C.messages.create(...)
                    - metavariable-regex:
                        metavariable: $C
                        regex: (?i)^(\w+\.)*(openai|anthropic|claude|genai|gemini|llm|ai)(client)?$
                # 이 저장소 안의 AI 도우미 모듈(@/lib/openai, ./ai)을 가져온다
                - patterns:
                    - pattern-either:
                        - pattern: import $X from "$M"
                        - pattern: import { ... } from "$M"
                    - metavariable-regex:
                        metavariable: $M
                        regex: (?i)^(\.{1,2}|[@~#])(/[\w.-]+)*/(ai|llm|genai|openai|gpt|gemini|claude|anthropic)$
                # 템플릿 문자열(`${BASE}/api/chat`)은 메타변수 정규식이 내용을 보지 못해 문자열 안의 경로로 본다
                - pattern-regex: '["''`][^"''`\n]*/api/(ai|chat|gpt|llm|genai|generate|completions?)\b[^"''`\n]*["''`]'
                - patterns:
                    - pattern-either:
                        - pattern: fetch($U, ...)
                        - pattern: $A.$VERB($U, ...)
                        - pattern: useSWR($U, ...)
                    - metavariable-regex:
                        metavariable: $U
                        regex: (?i)^[`'"].*((/|\b)(ai|gpt|llm|openai|genai|claude|gemini|chat/completions)|/api/(chat|generate|completions?))(/|[`'"?]).*
                - patterns:
                    - pattern-either:
                        - pattern: $F(...)
                        - pattern: $O.$F(...)
                        - pattern: <$F ... />
                        - pattern: <$F ...>...</$F>
                    - metavariable-regex:
                        metavariable: $F
                        regex: ^(use|fetch|get|post|request|generate|create)?(Ai|AI|Gpt|GPT|Llm|LLM|Rag|RAG)[A-Z]\w*$|^(ai|gpt|llm|rag)[A-Z]\w*$
                    - pattern-not-inside: |
                        import { ..., $F, ... } from "react-icons/ai";
                        ...
                # 대화 메시지의 발화자 'assistant' — 생성형 모델의 답을 다루는 채팅 구조다
                - patterns:
                    - pattern-either:
                        - pattern: '{..., $K: "assistant", ...}'
                        - pattern: $M.$K === "assistant"
                        - pattern: $M.$K == "assistant"
                    - metavariable-regex:
                        metavariable: $K
                        regex: ^(role|type|sender|author|from)$
          - id: renders-jsx
            static:
              pattern-regex: return\s*\(\s*<

        applies-ai:
          question: 이 코드는 생성형 AI가 만든 결과물을 사용자 화면에 보여 주는가?

        compliant-if-any:
          - id: label-text
            strength: weak
            static:
              pattern-regex: (?i)(생성형\s*AI|AI\s*(가|로)?\s*(생성|작성|답변|요약)|AI-generated|인공지능.{0,10}(생성|작성))
            on-unsatisfied:
              message: 생성형 AI 결과물이라는 표시 문구가 보이지 않습니다.
              ask-developer: 이 화면에서 AI 생성물이라는 표시는 어디에 있나요?

          # '예'가 "이 표시가 코드에 있다"는 뜻이라 strict 다. 주석("// 배지는 레이아웃이 붙인다")을 인용한
          # '예'는 받지 않는다
          - id: ai-label
            ai:
              question: 이 화면에 생성형 AI가 만든 결과물이라는 표시(배지, 문구, 설명 등)가 함께 있는가?
              evidence: strict
            on-unsatisfied:
              message: 생성형 AI 결과물 표시를 찾지 못했습니다.
              ask-developer: 이 응답이 AI가 만든 것임을 이용자가 어떻게 알 수 있나요?
              remediation: 결과물 가까이에 표시 배지나 문구를 넣으세요.

          # 시행령 제23조 제2항 제2호. 기계 판독 표시(C2PA 매니페스트, IPTC DigitalSourceType
          # 메타데이터, 비가시 워터마크 등)와 "1회 이상 안내 문구ㆍ음성" 이 둘 다 있어야 한다.
          # 정적 대안을 따로 두지 않았다. 표시만 보는 정규식은 안내를 보지 못하고, 표시 어휘와 안내 문구를
          # 함께 보는 정규식은 안내 쪽 어휘가 label-text 와 같아 더하는 것이 없다.
          # 그래서 판정자가 둘 다 확인하고 실재하는 줄을 인용해야 풀린다. 표시를 넣는 코드가
          # 다른 파일(서버 lib)에 있으면 이 파일만으로는 확인되지 않아 경고가 남는다.
          # strict: 주석을 인용한 '예'는 받지 않는다(질문도 주석을 안내로 치지 않는다).
          - id: ai-machine-mark
            ai:
              question: >
                이 코드는 생성형 AI 결과물에 기계가 판독할 수 있는 표시(C2PA 매니페스트, IPTC DigitalSourceType
                trainedAlgorithmicMedia 메타데이터, 비가시 워터마크 등)를 넣고, 그와 별도로 결과물이 생성형 AI로
                생성되었다는 사실을 이용자에게 안내 문구나 음성으로 한 번 이상 알리는가? 둘 다 이 코드에 있어야 '예'다.
                주석이나 이용자에게 보이지 않는 문자열은 안내로 치지 않는다.
              evidence: strict
            on-unsatisfied:
              message: 기계 판독 표시와 1회 이상의 안내 문구·음성을 함께 찾지 못했습니다.
              ask-developer: >
                결과물에 메타데이터·워터마크 같은 기계 판독 표시를 넣나요? 그렇다면 AI 생성물이라는 사실을 이용자에게
                한 번 이상 알리는 안내는 어디에 있나요?
              remediation: >
                기계 판독 표시만으로는 부족합니다. 결과물이 생성형 AI로 생성되었다는 사실을 안내 문구나 음성으로
                한 번 이상 알리세요(시행령 제23조 제2항 제2호).

  # ───────────────────────────────────────────────────────────────────────────
  - id: kr.ai-basic-act.31-1
    category: ai-prior-notice
    title: 생성형 AI 기반 서비스 사전 고지
    ask-developer: 이용자가 이 기능을 처음 쓰기 전에, 이 기능이 생성형 인공지능에 기반하여 운용된다는 사실을 어디서 알리나요?

    legal:
      violated-when-failed:
        # 법 제31조 ① 이 의무이고, 시행령 제23조 ① 이 그 방법이다(각 호의 어느 하나).
        #   1호 제품등에 직접 기재하거나 계약서, 사용 설명서, 이용약관 등에 기재
        #       → 약관·계약서 문구는 코드에 없는 경우가 많다. 확인 질문으로 묻는다
        #   2호 이용자의 화면 또는 단말기 등에 표시   ← 정적 대안 셋과 AI 대안이 보는 것
        #   3호 제품등을 제공하는 장소에 게시         → 코드로 볼 수 없다
        #   4호 과학기술정보통신부장관이 인정하는 방법 → 2026-09-22 현재 찾지 못했다
        #
        # 시행령 제23조 ④ 의 예외 셋은 경고를 푸는 대안으로 두지 않았다.
        #   1호 서비스명·이용자 화면·결과물 문구 등으로 생성형 인공지능 활용 사실이 명백한 경우
        #   2호 인공지능사업자의 내부 업무 용도로만 사용되는 경우
        #   3호 과학기술정보통신부장관이 정하여 고시하는 경우 (2026-09-22 현재 고시를 찾지 못했다)
        # ④ 가 "적용하지 않을 수 있다"고 한 것은 시행령 제1항부터 제3항까지의 규정(방법)이다.
        # 법 제31조 ① 의 의무 자체가 풀리는지는 해석의 문제라 도구가 정하지 않고 사람에게 남긴다.
        # 그래서 확인 질문(on-unsatisfied)에서 이 예외에 해당하는지 묻는다. 고시가 나오면 다시 본다.
        #
        # 시행령 제23조의 effective-from 은 받은 판본의 시행일 2026-08-20 이다(원문 파일의 '시행' 줄).
        # 제23조 자체가 언제부터 시행 중인지와 그 근거는 위 kr.ai-basic-act.31 의 주석에 있다.
        - statute: 인공지능 발전과 신뢰 기반 조성 등에 관한 기본법
          article: 제31조
          clause: 제1항
          url: https://www.law.go.kr/법령/인공지능발전과신뢰기반조성등에관한기본법
          text-file: _legal/ai-basic-act-31.txt
          text-sha256: a3e9fa7e1fd0835e8dc453c00136038b42d8ac113589f78a10d0fc1b989ac891
          text-retrieved: '2026-09-22'
          effective-from: '2026-01-22'
          law-id: '014820'
        - statute: 인공지능 발전과 신뢰 기반 조성 등에 관한 기본법 시행령
          article: 제23조
          clause: 제1항
          url: https://www.law.go.kr/법령/인공지능발전과신뢰기반조성등에관한기본법시행령
          text-file: _legal/ai-basic-act-decree-23.txt
          text-sha256: 2f8929570eff16fb80411da1160fe786af564b84d3f61b201e72996850938a07
          text-retrieved: '2026-09-22'
          effective-from: '2026-08-20'
          law-id: '015032'
    review:
      review-by: 2027-09-22
    # 이용자에게 보이는 글에 적지 않는 것. 원문을 이 팩에 고정하지 않은 조문이라 주석에만 둔다.
    #   제재  법 제43조 제1항 제1호: 제31조 제1항을 위반하여 고지를 이행하지 아니한 자는 3천만원 이하의
    #         과태료. 제2항·제3항 위반은 사실조사(제40조 제1항)와 중지·시정명령(같은 조 제3항)을 거치고,
    #         명령을 이행하지 않으면 과태료다(제43조 제1항 제3호).
    #   정의  고영향 인공지능은 법 제2조 제4호, 생성형 인공지능은 같은 조 제5호, 인공지능사업자는 제7호.
    #   적용  법 제4조 제1항: 국외에서 이루어진 행위라도 국내 시장 또는 이용자에게 영향을 미치는 경우에는
    #         적용한다. 고지 문구를 영어로도 받는 까닭이다.
    #   출처  2026-09-22 국가법령정보 Open API(법 MST 282791). 받은 글은 태그 archive/research-2026-09-29 의
    #         docs/alternatives/c5-ai-prior-notice/README.md 1.3·1.4·1.7 에 있다.
    #   집행  과학기술정보통신부가 과태료에 최소 1년 이상의 계도기간을 두겠다고 밝혔다는 보도가 있다.
    #         법령이 아니라 집행 방침이고 2차 자료로만 확인했다(2026-10-06).
    #         https://www.korea.kr/news/policyNewsView.do?newsId=148958380
    #   원문을 받아 violated-when-failed 에 고정하면 본문에 적을 수 있다.
    rationale:
      motivation: >
        채팅·생성 화면은 모델을 부르는 코드와 입력창만으로 완성되기 쉬워서, 이용자가 처음 쓰기 전에
        보는 고지가 빠진다. 결과물마다 붙는 'AI 생성' 표시(제31조 제2항, kr.ai-basic-act.31)는 첫
        결과가 나온 뒤에야 보이므로 그것만으로 사전 고지라고 보기 어렵다. 다만 시행령 제23조 제4항
        제1호가 결과물에 표시된 문구도 고려 요소로 들므로 예외 해당 여부는 사람이 판단한다.
      implementation: >
        이 정책은 생성형 인공지능만 본다. 고영향 인공지능은 채용·대출 심사 같은 영역에
        쓰이는지를 코드만으로 정할 수 없어 뺐다. 적용은 한 파일이 생성형 모델을 실제로 부르고(SDK 의
        생성 호출, AI SDK 의 생성 함수·훅, LLM 제공자 API, 자체 AI 엔드포인트) 같은 파일이 화면(JSX)을
        그릴 때다. SDK 를 가져오기만 하거나 임베딩·모델 목록처럼 생성하지 않는 호출은 보지 않는다.
        화면 없는 API 경로도 보지 않는다. 고지는 이용자가 보는 화면이나 약관·계약서에서 하므로
        (시행령 제23조 제1항 제1호·제2호) 경로마다 경고하면 같은 기능을 두 번 보고한다. 대안은 화면의
        고지 문구, 고지 컴포넌트, 고지 확인 플래그로 막는 진입 분기이고 셋 다 이름·문자열 근거(weak)다.
        조건부로 렌더링되거나 숨겨졌거나 렌더링되지 않는 고지는 정적 대안으로 치지 않고 판정자에게 넘긴다.
        문구는 영어도 받는다. 고지가 레이아웃·이전 화면·번역 파일·약관 문서에 있으면 여기서 보이지 않아
        검토 필요로 남는다. 놓치는 것: 모델 호출이 다른 파일에만 있고 이 파일은 화면만 그리는 경우(서버
        액션을 ai/rsc 밖에서 부르는 화면, 경로 파일이 따로 있는 화면), 이름에 AI 가 드러나지 않는 자체
        엔드포인트(/api/ask, baseURL 을 둔 axios 인스턴스의 "/chat"), 이름이 is·has 로 시작하는 lib 도우미.

    rules:
      - id: genai-feature-without-prior-notice
        applies-when:
          # 파싱되지 않은 파일에서도 값을 내는 정규식 문턱. 아래 두 조건은 구문 조건이라 파싱에
          # 실패하면 '모름'이 되는데, 이 문턱이 없으면 파싱 안 된 모든 JS/TS 파일이 이 규칙의
          # '불확실'이 된다. genai-call 이 잡는 것의 상위집합이어야 한다
          - id: genai-hint
            static:
              pattern-regex: (?i)(\bopenai\b|anthropic|claude|\bgenai\b|@google/generative-ai|vertexai|generativelanguage|client-bedrock-runtime|@ai-sdk/|@langchain/|\bfrom\s+["']ai(/[\w-]+)?["']|\brequire\(\s*["']ai["']\s*\)|\bfrom\s+["'](\.{1,2}|[@~#])(/[\w.-]+)*/(ai|llm|genai|openai|gpt|gemini|claude|anthropic)(/[\w.-]+)*["']|\.chat\.completions\.|\.models\.generate|/api/(ai|llm|gpt|genai|openai|assistant|copilot|completions?|chat|generate)\b)

          # 생성형 모델을 실제로 부르는 자리. 자체 엔드포인트·lib 도우미 갈래는 이름만 본다.
          # 걸러 낸 함정(픽스처로 확인):
          #   - Twilio·Vonage 의 client.messages.create 는 Anthropic 과 모양이 같다. 설문 SDK 의
          #     tf.responses.create 는 OpenAI 와 같다. 그래서 받는 쪽($C)을 묶는다. 이 파일에서 만든
          #     클라이언트면 만든 함수·클래스가 AI 이름이거나 AI 모듈에서 온 것이어야 하고, 이 파일에서
          #     만들지 않은 클라이언트(가져온 인스턴스, anthropic.beta)면 파일에 AI 모듈 import 가 있어야
          #     한다. 앞의 것이 없으면 OpenAI 를 모더레이션에만 쓰는 파일의 Twilio 발송이 걸렸다
          #   - 직접 만든 useChat 훅(사람 상담 채팅) → ai·@ai-sdk 모듈에서 가져온 것만
          #   - openai.embeddings·models.list·moderations 는 생성하지 않는다 → 목록에 없다. 제공자 URL 을
          #     직접 부를 때도 같은 경로(/v1/embeddings·/v1/models·moderations·:embedContent·:countTokens)를 뺀다
          #   - /api/chat/rooms 같은 하위 경로, /api/generate-invoice, /api/agent(상담원), 관리 화면의
          #     /api/ai/usage·/api/copilot/seats 는 넣지 않았다
          # 일부러 남긴 오탐: 맨 /api/chat·/api/completions·/api/generate 는 AI SDK·예제의 기본 엔드포인트라
          # 넣었다. 사람 상담 채팅이나 강의 수료(/api/completions)도 걸린다. 빼면 AI 채팅 화면에서 규칙이
          # 말없이 꺼진다(픽스처 human-live-chat.tsx 와 달리 이 둘은 훅도 직접 만들지 않아 가릴 수 없다).
          # 고치지 않은 놓침(한 파일만 보는 규칙의 한계다):
          #   - 모델 호출이 다른 파일에만 있는 화면(page.tsx + route.ts, ai/rsc 밖의 서버 액션)
          #   - 이름이 드러나지 않는 자체 엔드포인트를 감싼 클라이언트(api.post("/chat"), baseURL 을 둔
          #     axios 인스턴스). URL 이름만 보는 조건이라 감싸면 이름이 사라진다
          - id: genai-call
            static:
              pattern-either:
                - patterns:
                    - pattern: $C.chat.completions.$M(...)
                    - metavariable-regex:
                        metavariable: $M
                        regex: ^(create|parse|stream|runTools)$
                - pattern: $C.models.generateContent(...)
                - pattern: $C.models.generateContentStream(...)
                - pattern: $C.models.generateImages(...)
                # 모양이 다른 SDK 와 겹치는 호출(아래 세 갈래는 같은 호출 목록). 받는 쪽을 이 파일에서
                # 만들었으면 만든 것을 본다. new OpenAI(), createOpenAI(), genAI.getGenerativeModel() 처럼
                # AI 이름으로 만든 것
                - patterns:
                    - pattern-either:
                        - pattern: $C.responses.create(...)
                        - pattern: $C.responses.stream(...)
                        - pattern: $C.images.generate(...)
                        - pattern: $C.images.edit(...)
                        - pattern: $C.audio.speech.create(...)
                        - pattern: $C.messages.create(...)
                        - pattern: $C.messages.stream(...)
                        - pattern: $C.generateContent(...)
                        - pattern: $C.generateContentStream(...)
                    - pattern-either:
                        - pattern-inside: |
                            $C = new $K(...);
                            ...
                        - pattern-inside: |
                            $C = $K(...);
                            ...
                    - metavariable-regex:
                        metavariable: $K
                        regex: (?i)(openai|anthropic|claude|genai|generative|gemini|vertex)
                # AI 모듈에서 가져온 것으로 만든 것(import { createClient } from "@/lib/openai")
                - patterns:
                    - pattern-either:
                        - pattern: $C.responses.create(...)
                        - pattern: $C.responses.stream(...)
                        - pattern: $C.images.generate(...)
                        - pattern: $C.images.edit(...)
                        - pattern: $C.audio.speech.create(...)
                        - pattern: $C.messages.create(...)
                        - pattern: $C.messages.stream(...)
                        - pattern: $C.generateContent(...)
                        - pattern: $C.generateContentStream(...)
                    - pattern-either:
                        - pattern-inside: |
                            $C = new $K(...);
                            ...
                        - pattern-inside: |
                            $C = $K(...);
                            ...
                    - pattern-either:
                        - pattern-inside: |
                            import { ..., $K, ... } from "$KMOD";
                            ...
                        - pattern-inside: |
                            import $K from "$KMOD";
                            ...
                    - metavariable-regex:
                        metavariable: $KMOD
                        regex: (?i)^(.*[/@-])?(openai|anthropic(-ai/[\w-]+)?|claude|genai|generative-ai|vertexai)$
                # 받는 쪽을 이 파일에서 만들지 않았다(가져온 인스턴스, this.client, anthropic.beta).
                # 파일의 AI 모듈 import 로 가른다
                - patterns:
                    - pattern-either:
                        - pattern: $C.responses.create(...)
                        - pattern: $C.responses.stream(...)
                        - pattern: $C.images.generate(...)
                        - pattern: $C.images.edit(...)
                        - pattern: $C.audio.speech.create(...)
                        - pattern: $C.messages.create(...)
                        - pattern: $C.messages.stream(...)
                        - pattern: $C.generateContent(...)
                        - pattern: $C.generateContentStream(...)
                    - pattern-not-inside: |
                        $C = new $K2(...);
                        ...
                    - pattern-not-inside: |
                        $C = $K2(...);
                        ...
                    - pattern-either:
                        - pattern-inside: |
                            import $A from "$MOD";
                            ...
                        - pattern-inside: |
                            import { ..., $A, ... } from "$MOD";
                            ...
                        - pattern-inside: |
                            import * as $A from "$MOD";
                            ...
                        - pattern-inside: |
                            $A = require("$MOD");
                            ...
                    - metavariable-regex:
                        metavariable: $MOD
                        regex: (?i)^(.*[/@-])?(openai|anthropic(-ai/[\w-]+)?|claude|genai|generative-ai|vertexai)$
                # Gemini 채팅 세션(@google/generative-ai 의 startChat, @google/genai 의 chats.create)
                - patterns:
                    - pattern-either:
                        - pattern: $M.startChat(...)
                        - pattern: $AI.chats.create(...)
                    - pattern-either:
                        - pattern-inside: |
                            import { ..., $G, ... } from "$GMOD";
                            ...
                        - pattern-inside: |
                            import $G from "$GMOD";
                            ...
                    - metavariable-regex:
                        metavariable: $GMOD
                        regex: ^@google(-cloud)?/(generative-ai|genai|vertexai)$
                - patterns:
                    - pattern-either:
                        - pattern: $F(...)
                        - pattern: $NS.$F(...)
                    - metavariable-regex:
                        metavariable: $F
                        regex: ^(generateText|streamText|generateObject|streamObject|generateImage|experimental_generateImage|generateSpeech|experimental_generateSpeech|streamUI|createStreamableUI|createStreamableValue|useChat|useCompletion|useObject|experimental_useObject|useAssistant|experimental_useAssistant|useActions|useUIState|useAIState|useStreamableValue|readStreamableValue)$
                    - pattern-either:
                        - pattern-inside: |
                            import { ..., $F, ... } from "$M";
                            ...
                        - pattern-inside: |
                            import { ..., $X as $F, ... } from "$M";
                            ...
                        - pattern-inside: |
                            import * as $NS from "$M";
                            ...
                    - metavariable-regex:
                        metavariable: $M
                        regex: ^(ai|ai/react|ai/rsc|ai/svelte|ai/vue|@ai-sdk/(react|vue|svelte|angular|rsc))$
                # LangChain. 모델 인스턴스를 바로 부르거나, pipe·RunnableSequence 로 엮은 체인(LCEL)을 부른다
                - patterns:
                    - pattern-either:
                        - pattern: $LLM.invoke(...)
                        - pattern: $LLM.stream(...)
                    - pattern-inside: |
                        import { ..., $CLS, ... } from "$LC";
                        ...
                    - pattern-either:
                        - pattern-inside: |
                            $LLM = new $CLS(...);
                            ...
                        - pattern-inside: |
                            $LLM = $P.pipe(...);
                            ...
                        - pattern-inside: |
                            $LLM = RunnableSequence.from(...);
                            ...
                    - metavariable-regex:
                        metavariable: $LC
                        regex: ^@langchain/(openai|anthropic|google-genai|google-vertexai|mistralai|groq|ollama|aws)$
                # Amazon Bedrock Runtime 의 생성 명령
                - patterns:
                    - pattern: new $CMD(...)
                    - metavariable-regex:
                        metavariable: $CMD
                        regex: ^(InvokeModelCommand|InvokeModelWithResponseStreamCommand|ConverseCommand|ConverseStreamCommand)$
                    - pattern-inside: |
                        import { ..., $CMD, ... } from "@aws-sdk/client-bedrock-runtime";
                        ...
                # 자체 AI 모듈의 도우미(import { summarizeReviews } from "@/lib/ai"). 경로 이름만 본다.
                # is·has·can·should 로 시작하는 이름은 설정 확인이라 뺐다
                - patterns:
                    - pattern: $F(...)
                    - pattern-inside: |
                        import { ..., $F, ... } from "$LM";
                        ...
                    - metavariable-regex:
                        metavariable: $LM
                        regex: ^(\.{1,2}|[@~#])(/[\w.-]+)*/(ai|llm|genai|openai|gpt|gemini|claude|anthropic)(/[\w.-]+)*$
                    - metavariable-regex:
                        metavariable: $F
                        regex: ^(?!(is|has|can|should)[A-Z_])\w+$
                # 자체 엔드포인트와 제공자 URL. 관리 화면의 하위 경로와 생성하지 않는 제공자 경로는 뺐다
                - patterns:
                    - pattern-either:
                        - pattern: fetch("$URL", ...)
                        - pattern: axios.post("$URL", ...)
                        - pattern: axios.get("$URL", ...)
                    - metavariable-regex:
                        metavariable: $URL
                        regex: ^(/api/((ai|llm|gpt|genai|openai|assistant|copilot|completions?)(?![-/](usage|seats?|billing|keys?|quota|settings|stats|admin)(?![\w-]))([-/][\w/-]*)?|chat(/(stream|completions?))?|generate)/?(\?.*)?|https://(api\.openai\.com|api\.anthropic\.com|generativelanguage\.googleapis\.com)/(?!v1\w*/(embeddings|moderations|files|fine_tuning|organizations?)\b|v1\w*/models/?(\?.*)?$|v1\w*/models/[^/:?]+/?(\?.*)?$|v1\w*/messages/count_tokens\b|.*:(embedContent|batchEmbedContents|countTokens)\b).*)$
                # 기준 URL 을 붙인 템플릿 문자열(`${API_BASE}/api/chat`). 보간된 템플릿에는
                # metavariable-regex 를 쓸 수 없다(semgrep 1.176 실측: $U 에 `${` 조차 남지 않는다).
                # 그래서 호출 구문으로 자리를 좁히고, 그 범위의 원문을 정규식으로 본다
                - patterns:
                    - pattern-either:
                        - pattern: fetch(`...`, ...)
                        - pattern: axios.post(`...`, ...)
                    - pattern-regex: (?:fetch|axios\.post)\(\s*`\$\{[^`}]+\}/api/((ai|llm|gpt|genai|openai|assistant|copilot|completions?)(?![-/](usage|seats?|billing|keys?|quota|settings|stats|admin)(?![\w-]))([-/][\w/-]*)?|chat(/(stream|completions?))?|generate)/?(\?[^`]*)?`

          # 이용자가 보는 화면. 정규식 `return (<` 는 .ts 의 타입 단언 `return <any>x` 에도 걸려서
          # JSX 구문 조건으로 바꿨다(.ts 에서는 JSX 가 아니라 단언으로 파싱된다)
          - id: renders-ui
            static:
              pattern-either:
                - pattern: <$EL ... />
                - pattern: <$EL ...>...</$EL>

        applies-ai:
          question: 이 코드는 이용자에게 생성형 인공지능(글·이미지·음성 등을 생성)을 이용한 기능을 제공하는 화면인가? 인공지능사업자의 내부 직원만 쓰는지는 판단하지 말고, 화면에서 생성형 모델의 결과를 쓰는 기능인지만 답하라.

        compliant-if-any:
          # 이용자가 처음 쓰기 전에 볼 수 있는 화면(JSX)의 글과, 그 화면에 늘 렌더링되는 고지용 이름의
          # 상수만 본다. 아래는 보지 않는다(모두 경고를 말없이 푸는 모양이다).
          #   - 이용자에게 보이지 않는 것: 주석, JSX 속성값(alt·title·content·aria-label 등, <meta>),
          #     <title>, 숨긴 요소(hidden, aria-hidden="true", display: none, className 의
          #     hidden·sr-only·invisible), 선언만 하고 렌더링하지 않은 상수
          #   - 꺼져 있거나 쓴 뒤에야 보일 수 있는 것: 조건부 렌더링(`cond && …`, `cond ? … : …`, if 문의
          #     본문), 조건부로만 렌더링하는 상수. 상수 false 플래그 뒤의 고지, 첫 응답 뒤에만 뜨는 안내가
          #     이 모양이다. 빈 화면(messages.length === 0)에만 뜨는 올바른 고지도 여기서는 못 풀고,
          #     판정자가 조건을 읽고 그 줄을 인용해야 풀린다(경고를 올리는 쪽의 오류)
          #   - 목록(.map) 안의 문구 — 결과물마다 붙는 표시(제2항)다
          # 'AI가 생성한 답변' 같은 결과 표시는 일부러 뺐다. 'Powered by OpenAI', 'AI can make mistakes',
          # 'Use AI to rewrite' 같은 버튼 문구는 AI 활용을 드러낼 뿐 운용 사실을 알리지 않아 뺐다.
          # 시행령 제23조 제4항 제1호('명백한 경우')인지와 함께 판정자·사람 몫이다.
          # 알려진 한계: 렌더링하지 않는 컴포넌트 함수 안의 문구는 걸러 내지 못한다(판정자 몫).
          - id: prior-notice-text
            strength: weak
            static:
              patterns:
                - pattern-regex: (?i)((인공지능|(?<![a-z])AI(?![a-z])|LLM|GPT|언어\s*모델)(\s*(기술|모델|엔진|시스템))?[)\s]*(을|를|에)?\s*(기반|활용|이용|사용)(하여|해|해서|한|하는|으로|으로\s*하여)?\s*(운영|운용|제공|작동|동작)|(인공지능|(?<![a-z])AI(?![a-z]))[)\s]*기반(의)?\s*(서비스|챗봇|상담|도우미|어시스턴트)|powered\s+by\s+(generative\s+)?(AI|artificial\s+intelligence|LLMs?|large\s+language\s+models?)(?![a-z])|(?<![a-z])AI[- ](powered|based)\s+(service|assistant|chatbot|chat|feature|tool|app|search)|(?<![a-z])(uses|runs\s+on|is\s+based\s+on|relies\s+on|built\s+on)\s+(generative\s+)?(AI|artificial\s+intelligence|large\s+language\s+models?)(?![a-z]))
                - pattern-either:
                    - pattern-inside: <$EL ...>...</$EL>
                    - pattern-inside: <$EL ... />
                    # 고지용 이름의 상수. 그 선언(첫 pattern-inside)이 문구를 감싸고, 같은 상수가 JSX 에
                    # 렌더링되어야 한다(둘째). 조건부로 렌더링되면 뺀다
                    - patterns:
                        - pattern-either:
                            - pattern-inside: $V = "..."
                            - pattern-inside: $V = `...`
                        - pattern-either:
                            - pattern-inside: |
                                $V = "...";
                                ...
                                <$E ...>...{$V}...</$E>
                            - pattern-inside: |
                                $V = `...`;
                                ...
                                <$E ...>...{$V}...</$E>
                        - pattern-not-inside: |
                            $V = $VAL;
                            ...
                            <... $W && <$E2 ...>...{$V}...</$E2> ...>
                        - pattern-not-inside: |
                            $V = $VAL;
                            ...
                            <... $W ? <$E2 ...>...{$V}...</$E2> : $Z ...>
                        - pattern-not-inside: |
                            $V = $VAL;
                            ...
                            <... $W ? $Z : <$E2 ...>...{$V}...</$E2> ...>
                        - metavariable-regex:
                            metavariable: $V
                            regex: (?i)^\w*(notice|disclaimer|disclosure|banner|intro|onboarding|caption|tagline|subtitle|description)\w*$
                - pattern-not-inside: $COND && $X
                - pattern-not-inside: "$COND ? $A : $B"
                - pattern-not-inside: if ($COND) $S;
                - pattern-not-inside: if ($COND) { ... }
                - pattern-not-inside: $XS.map(...)
                - pattern-not-inside: <title>...</title>
                - pattern-not-inside: <$H ... hidden ...>...</$H>
                - pattern-not-inside: <$H ... aria-hidden="true" ...>...</$H>
                - pattern-not-inside: '<$H ... style={{..., display: "none", ...}} ...>...</$H>'
                # 주석. 문자열 안의 `/*`·`//`(accept="image/*", "https://…")는 주석의 시작이 아니므로 건너뛴다
                - pattern-not-regex: '"(?:[^"\\\n]|\\.)*"(*SKIP)(*FAIL)|''(?:[^''\\\n]|\\.)*''(*SKIP)(*FAIL)|/\*[\s\S]*?\*/'
                - pattern-not-regex: '"(?:[^"\\\n]|\\.)*"(*SKIP)(*FAIL)|''(?:[^''\\\n]|\\.)*''(*SKIP)(*FAIL)|(?<!:)//[^\n]*'
                # JSX 속성값(<img alt="…">, <meta content="…" />, title=, aria-label=). 이름과 = 사이에
                # 공백이 없는 꼴만 본다(코드 서식기가 JS 대입에는 공백을 둔다)
                - pattern-not-regex: '(?<=\s)[\w:.-]+=(?:"[^"\n]*"|''[^''\n]*''|\{\s*(?:"[^"\n]*"|''[^''\n]*''|`[^`]*`)\s*\})'
                # className 으로 숨긴 요소의 글(sr-only, hidden, invisible. 반응형 md:hidden 도 뺀다)
                - pattern-not-regex: 'className=["''][^"'']*(?<![\w-])(?:sr-only|hidden|invisible)(?![\w-])[^"'']*["''][^>]*>[^<]*'
            on-unsatisfied:
              message: 이 서비스가 인공지능에 기반하여 운용된다는 안내 문구가 화면(JSX)에 조건 없이 보이지 않습니다.
              ask-developer: 이용자가 AI 기능을 쓰기 전에 보는 안내 문구는 어디에 있나요? 레이아웃·이전 화면·번역 파일에 있다면 그 위치를, 조건부로 보인다면 그 조건이 첫 이용 전에 참인지 알려 주세요.
              remediation: 입력창이나 생성 버튼보다 먼저 보이는 자리에 "이 서비스는 생성형 인공지능을 기반으로 운영됩니다" 같은 문구를 두세요.

          # 컴포넌트 이름만 본다. 낱말 속의 'ai'(EmailConsent, MaintenanceBanner, DetailBanner)가
          # 걸리지 않게 AI 토큰은 대문자로 시작하는 낱말로만 받는다. 조건부 렌더링(&&, 삼항, if 본문),
          # 숨긴 요소, 목록 안은 뺐다. 이름 꼬리 Intro 는 뺐다(AssistantIntro 가 인사말만 그렸다).
          # Assistant·Chatbot·Copilot 은 AI 라는 말이 아니라서 Notice·Disclosure·Disclaimer 가 붙어야 받는다
          - id: notice-component
            strength: weak
            static:
              patterns:
                - pattern-either:
                    - pattern: <$EL ... />
                    - pattern: <$EL ...>...</$EL>
                - pattern-not-inside: $COND && $X
                - pattern-not-inside: "$COND ? $A : $B"
                - pattern-not-inside: if ($COND) $S;
                - pattern-not-inside: if ($COND) { ... }
                - pattern-not-inside: $XS.map(...)
                - pattern-not-inside: <$H ... hidden ...>...</$H>
                - pattern-not-inside: <$H ... aria-hidden="true" ...>...</$H>
                - pattern-not-inside: '<$H ... style={{..., display: "none", ...}} ...>...</$H>'
                - metavariable-regex:
                    metavariable: $EL
                    regex: ^\w*?((?<![A-Z])(AI|Ai|GenAI|GenAi|LLM|Llm)(?![a-z])\w*?(Notice|Disclosure|Disclaimer|Banner|Onboarding|Consent)|(?<![A-Z])(Assistant|Chatbot|Copilot)(?![a-z])\w*?(Notice|Disclosure|Disclaimer))\w*$
            on-unsatisfied:
              message: AI 고지 컴포넌트로 보이는 요소를 조건 없이 렌더링하지 않습니다.
              ask-developer: AI 기반 운용 사실을 알리는 컴포넌트가 이 화면에서 늘 보이나요? 플래그 뒤에 있다면 그 플래그는 언제 켜지나요?

          # 'AI 고지를 봤는가' 플래그로 기능 진입을 막는 분기(진입 모달·온보딩). 이름만 본다.
          # cookieAccepted·termsAccepted 같은 일반 동의 플래그와, aiTermsVersion 같은 약관 플래그는
          # 받지 않는다. 약관 동의 여부만으로는 약관에 AI 기반 운용 사실이 적혀 있는지 알 수 없다.
          # 분기가 실제로 막아야 한다: 본문이 return 하거나 redirect·router.push/replace·navigate 로
          # 보내야 받는다(skipAiIntro 의 if 가 분석 이벤트만 보냈다). skip·hide·disable·no·not·without·
          # suppress 로 시작하는 뒤집힌 이름과, 상수 true/false 로 정한 플래그(이용자마다 다르지 않다)는 뺐다.
          # 알려진 한계: 이름이 '보여 준다'는 뜻인데 이용자 상태로 정해지는 플래그(showAiNotice = cfg.x)가
          # 꺼져 있는지는 알 수 없다. 약한 대안이라 판정자가 다시 본다
          - id: notice-gate-flag
            strength: weak
            static:
              patterns:
                - pattern-either:
                    - pattern: if (<... $K ...>) return $R;
                    - pattern: if (<... $K ...>) return;
                    - pattern: if (<... $K ...>) { ... return $R; }
                    - pattern: if (<... $K ...>) { ... return; }
                    - pattern: if (<... $O.$K ...>) return $R;
                    - pattern: if (<... $O.$K ...>) return;
                    - pattern: if (<... $O.$K ...>) { ... return $R; }
                    - pattern: if (<... $O.$K ...>) { ... return; }
                    - patterns:
                        - pattern-either:
                            - pattern: if (<... $K ...>) $NAV(...);
                            - pattern: if (<... $K ...>) { ... $NAV(...); ... }
                            - pattern: if (<... $O.$K ...>) $NAV(...);
                            - pattern: if (<... $O.$K ...>) { ... $NAV(...); ... }
                        # 보내는 호출만 받는다. `(\w+\.)*(push|replace)` 로 두면 if 본문의
                        # `list.push(x)` 도 분기가 막는다고 읽혀 경고가 풀린다
                        - metavariable-regex:
                            metavariable: $NAV
                            regex: ^(redirect|permanentRedirect|navigate|(\w*([Rr]outer|history|location))\.(push|replace|assign))$
                - pattern-not-inside: |
                    $K = false;
                    ...
                - pattern-not-inside: |
                    $K = true;
                    ...
                - metavariable-regex:
                    metavariable: $K
                    regex: ^\w*?((^|_)(ai|genai|llm|assistant)(?=[A-Z0-9_])|(^|_|(?<=[a-z0-9]))(Ai|AI|GenAi|GenAI|Llm|LLM|Assistant|ASSISTANT)(?![a-z]))\w*?(?i:notice|disclosure|disclaimer|intro|onboarding)\w*$
                - metavariable-regex:
                    metavariable: $K
                    regex: ^(?!(?i:skip|hide|hidden|disable|disabled|no|not|without|suppress)(?:[A-Z0-9_]|$))
            on-unsatisfied:
              message: 이용 전에 AI 고지를 확인했는지 검사해 기능 진입을 막는 분기가 보이지 않습니다.
              ask-developer: 처음 쓰는 이용자에게 AI 고지를 먼저 보여 주는 진입 화면이나 모달이 있나요? 이용약관이나 계약서에 AI 기반 운용 사실을 적어 두었다면(시행령 제23조 제1항 제1호) 어느 조항인가요?

          # strict: '예'는 "이 고지 문구가 코드에 실제로 있다"는 뜻이다. 약관 조항을 옮겨 적은 주석(terms-gate.tsx)을
          # 인용하거나, 끝에 그 주석이 붙은 줄을 통째로 인용한 '예'는 받지 않는다(required 는 주석을 떼고
          # import 줄만으로 받는다)
          - id: ai-prior-notice
            ai:
              question: 이용자가 이 기능을 처음 쓰기 전에(입력하거나 생성을 요청하기 전에) 볼 수 있는 화면 문구, 진입 전 모달·온보딩, 또는 이용 전에 보여 주는 약관·안내에, 이 기능이 인공지능에 기반하여 운용된다는 사실이 코드에 실제로 적혀 있는가? 한국어가 아니어도 된다. 결과물 옆에만 붙는 'AI 생성' 표시, 첫 응답 뒤에 뜨는 안내, 꺼진 플래그 뒤에 있어 보이지 않는 안내, 주석 안의 문구는 인정하지 않는다. 약관 동의 여부만 검사하고 약관에 그 사실이 적혀 있는지는 코드에 보이지 않으면 '아니오'다.
              evidence: strict
            on-unsatisfied:
              message: 이용 전에 인공지능 기반 운용 사실을 알리는 문구나 절차를 코드에서 찾지 못했습니다.
              ask-developer: 이 기능이 생성형 인공지능으로 운용된다는 사실을 이용자에게 언제, 어디서 알리나요? 서비스명이나 화면 문구로 그 사실이 명백한 경우(시행령 제23조 제4항 제1호), 내부 업무 용도로만 쓰는 경우(같은 항 제2호), 미리 만들어 둔 결과물을 보여 주기만 해서 인공지능사업자의 서비스인지 애매한 경우라면 사람이 판단해야 합니다.
              remediation: 입력이나 생성 요청 전에 보이는 자리(입력창 위, 진입 모달, 온보딩)에 이 기능이 생성형 인공지능을 기반으로 운영된다는 문구를 두세요.

  # ───────────────────────────────────────────────────────────────────────────
  - id: kr.network-act.50-4
    category: ads-disclosure
    title: 광고성 정보에 밝혀야 할 사항 — (광고) 표기, 전송자 명칭·연락처, 무료 수신거부 방법
    ask-developer: 이 메시지가 영리목적의 광고라면 (광고) 표기, 전송자의 명칭·연락처, 수신거부 방법이 정해진 자리에 들어가나요?

    legal:
      violated-when-failed:
        # 제50조 ④ 는 전송자의 명칭·연락처(1호)와 수신거부·철회 방법(2호)을 "대통령령으로 정하는
        # 바에 따라" 광고성 정보에 구체적으로 밝히라고 한다. ④ 에는 단서가 없다. 제1항 단서
        # (거래관계·전화권유)는 사전 동의만 면제하므로 이 의무를 덜어 주지 않는다.
        - statute: 정보통신망 이용촉진 및 정보보호 등에 관한 법률
          article: 제50조
          clause: 제4항
          url: https://www.law.go.kr/법령/정보통신망이용촉진및정보보호등에관한법률
          text-file: _legal/network-act-50.txt
          text-sha256: b54539a223fa635fa66c98a6098f388aff45755a268ebb402533a5245ea1394c
