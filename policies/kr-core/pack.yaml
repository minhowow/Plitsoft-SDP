        - statute: 정보통신망 이용촉진 및 정보보호 등에 관한 법률 시행령
          article: 제62조
          url: https://www.law.go.kr/법령/정보통신망이용촉진및정보보호등에관한법률시행령
          text-file: _legal/network-act-decree-62.txt
          text-sha256: 79ce876c698bd1acdb5ec7a3517775c24e2da7ecd8c3fd4a69812e26f21b65a2
          text-retrieved: '2026-09-22'
