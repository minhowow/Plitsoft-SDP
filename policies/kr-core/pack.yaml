          law-id: '004797'
    review:
      review-by: 2027-09-22
    rationale:
      motivation: >
        광고 문구만 넣고 발송 코드를 만들면 (광고) 표기, 전송자의 명칭과 연락처, 무료 수신거부 방법이
        빠지기 쉽다. 별표 6 은 매체마다 자리를 정한다. 문자·앱 푸시처럼 음성 외의 형태는 시작 부분과
        끝 부분에, 전자우편은 제목 시작 부분과 본문에 적어야 한다. 시행령 제61조 제3항과 제62조가 구체적인
        사항과 방법을 별표 6 에 맡기는데, 별표 6 원문은 아직 이 팩에 싣지 못했다. 원문은 법제처에서 직접
        확인해야 한다.
      implementation: >
        문자·푸시·이메일 발송 SDK 호출과 광고 어휘가 함께 있는 파일에서, 발송 메시지의 본문(text·body·content)이나
        제목(subject)에 들어가는 값이 정해진 자리에 표기를 담는지 본다. 헬퍼·상수로 조립하거나 코드 밖
        템플릿을 쓰면 정적 조건이 보지 못하므로 AI 가 해당 줄을 인용해야 풀린다.

    # 적용 조건 — 모든 규칙이 '발송 호출' 과 '광고 신호' 의 곱이다.
    #
    # ad-intent 는 어휘만 보는 조건이다. 정적 적용이 참이면 그대로 적용하고, applies-ai 는 정적 적용이
    # '모름'일 때만 묻는다. 그래서 거래 안내(주문·배송·결제)에 흔한 '쿠폰'·'할인' 은 어휘에서 뺐다.
    # 넣으면 "쿠폰 할인 3,000원 적용" 이 찍힌 배송 문자가 경고가 된다.
    # 같은 이유로 '이벤트' 는 주석에서 세지 않고, 영어 sale 은 대문자 SALE 만 센다. 개발자 주석('배송 시작
    # 이벤트 처리', '웹훅 이벤트')과 식별자(POS 의 sale, type Sale)에 흔해서, 파일 전체에서 세면 배송·
    # 인증번호·영수증 발송이 경고가 된다.
    # 어휘 말고도 광고 신호로 보는 것: 빈칸·부호를 넣은 표시('(광 고)'), 발송 대행사의 광고 표시
    # (contentType "AD", adFlag, isAd). 둘 다 kr.network-act.50-3 의 ad-marker 와 같은 식이다.
    # 알려진 한계: 어휘도 표시도 광고 플래그도 없는 광고("가을 신상 입고! 무료배송")는 ad-intent 가
    # 거짓이라 규칙이 조용히 꺼진다. 팩에서 어휘를 넓히면 거래 안내 오탐이 늘어난다.
    #
    # 발송 호출은 SDK·게이트웨이가 드러나는 모양만 센다(목록은 kr.network-act.50-3 의 &nonemail-send).
    # 이름이 send 인 메서드 전부를 세면 Express res.send, ws.send, socket.send 가 광고 발송이 된다.
    # $C.messages.create 도 받는 쪽을 가리지 않으면 LLM SDK(anthropic.messages.create,
    # openai.beta.threads.messages.create)를 문자로 착각한다. 그래서 .send 는 SMS SDK 객체
    # (new SolapiMessageService·coolsms)나 FCM messaging 에서 나온 것만, messages.create 는 인자에 to 가
    # 있거나 twilio 클라이언트에서 나온 것만 센다.
    # 알려진 한계: 받는 쪽을 모르는 `sms.send(...)`·주입된 `this.smsService.send(...)` 는 세지 않는다.
    # 세면 위의 오탐이 돌아오고, 세지 않으면 이 규칙이 꺼진다. 그런 파일의 야간 발송은 50-3 이
    # (적용으로 두어) 잡는다.
    # 이메일 SDK 는 비이메일 조건에 처음부터 들어가지 않는다. SES 의 ses.send 는 SESClient 에서
    # 나오고, SendGrid 의 sgMail.send 는 비이메일 목록에 없다.
    rules:
      - id: nonemail-start-block
        applies-when:
          - id: nonemail-send
            # 목록은 kr.network-act.50-3 의 send-call (나) 갈래에 있다(YAML 별칭은 앞에서만 정의할 수 있다)
            static: *nonemail-send
          - id: ad-intent
            # 정규식 하나로 둔다(파싱 실패와 무관하게 값을 낸다. kr.network-act.50-3 ad-marker 의 설명 참고).
            # 갈래는 차례로
            #   1. 광고 어휘. 주석 속 어휘도 센다(개발자가 '광고 문자'라고 적었다면 올리는 쪽이 맞다)
            #   2. 대문자 SALE. 소문자·첫 글자만 대문자인 sale 은 POS 의 sale·type Sale 식별자와 가를 수 없다
            #   3. '이벤트' — 주석이 아닌 곳만. 줄 전체 주석(//, /*, JSDoc 의 * 줄)과 줄 끝 // 주석 뒤는
            #      세지 않는다. URL 의 :// 는 주석으로 보지 않는다. 여러 줄 블록 주석의 * 없는 가운데 줄은
            #      가르지 못한다(올리는 쪽으로 남는다)
            #   4·5. kr.network-act.50-3 ad-marker 와 같은 식 — 빈칸·부호를 넣은 광고 표시, 광고 플래그.
            #      두 곳을 함께 고친다(YAML 별칭은 문자열을 이어 붙이지 못한다)
            static: &ad-intent
              pattern-regex: '(?i)(광고|마케팅|프로모션|특가|세일|혜택|marketing|promo|campaign|newsletter)|(?-i:\bSALE\b)|(?m:^(?![ \t]*(?://|/\*|\*))(?:[^/\n]|/(?!/)|(?<=:)/)*이벤트)|[\(\[（［【][ \t]*광[ \t·.\-_*]*고[ \t]*[\)\]）］】]|\bcontentType["'']?[ \t]*:[ \t]*["'']AD["'']|\b(?:adFlag|isAd)["'']?[ \t]*:[ \t]*true\b'

        # 주문·배송·결제 확인 같은 거래 안내가 광고성 정보가 아니라는 것은 조문이 아니라 기관 FAQ 의
        # 해석이다. 방송미디어통신위원회 불법 스팸 조사·단속 FAQ '거래정보의 범위'
        # (https://www.kmcc.go.kr/user.do?dc=K04100306&page=A04100306). 읽은 기록은 태그
        # archive/research-2026-09-29 의 docs/alternatives/c4-ad-disclosure/README.md 2.4 에 있다.
        # 아래 규칙들의 적용 질문도 같은 해석을 쓴다.
        applies-ai:
          question: 이 코드는 영리목적의 광고성 정보(할인·쿠폰·이벤트·신상품 홍보 등)를 문자·앱 푸시·메신저로 수신자에게 전송하는가? 주문·배송·결제·예약 확인, 리콜·보안 안내, 인증번호처럼 이미 맺은 거래를 이행하는 안내만 보내면 '아니오'라고 답하라.

        compliant-if-any:
          # 발송 호출에 넘긴 본문 값(text·body·content 키, 또는 그 키에 넘긴 같은 구역의 변수에 대입한 값)이
          # 정확히 '(광고)'로 시작하고, 바로 뒤에 명칭 자리의 낱말 하나와 전화번호가 오는지 본다.
          #   - 발송 호출 안의 객체만 본다. 보내지 않는 미리보기·예시 객체(SAMPLE = {text: "(광고) …"})나
          #     템플릿 표는 풀지 않는다. 객체를 변수에 담아 넘기면 AI 에 맡긴다
          #   - 변수 갈래는 대입 뒤에 다시 대입한 변수(text = prefix + text)를 받지 않는다. Semgrep 은
          #     `$V = $E` 를 `text += …` 에도 맞춘다(실측). 그래서 뒤에 이어 붙이기만 한 변수도 시작 부분은
          #     그대로인데 AI 로 넘어간다(경고를 올리는 쪽)
          #   - 명칭 자리는 문장부호 없는 2~20자 낱말 하나(대괄호 허용)다. 바로 뒤에 전화번호가 와야 한다.
          #     "(광고) 주말특가! … 1588-…" 처럼 머리말이 먼저 오면 맞지 않는다
          # 배열을 join 하거나 상수를 앞에 붙인 메시지도 정적으로 풀리지 않는다.
          # 명칭 + 주소 갈래는 AI 에 맡긴다.
          # 알려진 한계: 그 낱말이 전송자의 명칭인지, 번호가 전송자의 것인지는 모양으로만 본다.
          - id: label-name-phone
            static:
              patterns:
                - &in-send-call
                  pattern-either:
                    - pattern-inside: $SX.$SEND(...)
                    - pattern-inside: $SEND(...)
                - &send-call-name
                  metavariable-regex:
                    metavariable: $SEND
                    regex: ^(send|sendOne|sendMany|sendEach|sendEachForMulticast|sendMulticast|sendToDevice|sendToTopic|sendPushNotificationsAsync|sendNotification|createNotification|sendFriendtalk|sendFriendTalk|send(Sms|SMS|Lms|LMS|Mms|MMS|Push|PushNotification|FriendTalk|Friendtalk)|create|post|fetch)$
                - pattern-either:
                    - patterns:
                        - pattern: |
                            {..., $K: $MSG, ...}
                        - metavariable-regex:
                            metavariable: $K
                            regex: ^["']?(text|body|content)["']?$
                        - metavariable-regex:
                            metavariable: $MSG
                            regex: ^["'`]\(광고\)[ \t]*[\[【]?[^\s\d!?.,~"'`$\\\[\]【】]{2,20}[\]】]?[ \t]*(:|tel\.?|TEL\.?|☎|전화|고객센터|대표번호)?[ \t]*(0\d{1,2}-?\d{3,4}-?\d{4}|1[5-9]\d{2}-?\d{4})
                    - patterns:
                        - pattern-inside: |
                            $V = $MSG;
                            ...
                        - &not-reassigned
                          pattern-not-inside: |
                            $V = $MSG;
                            ...
                            $V = $E;
                            ...
                        - pattern: |
                            {..., $K: $V, ...}
                        - metavariable-regex:
                            metavariable: $K
                            regex: ^["']?(text|body|content)["']?$
                        - metavariable-regex:
                            metavariable: $MSG
                            regex: ^["'`]\(광고\)[ \t]*[\[【]?[^\s\d!?.,~"'`$\\\[\]【】]{2,20}[\]】]?[ \t]*(:|tel\.?|TEL\.?|☎|전화|고객센터|대표번호)?[ \t]*(0\d{1,2}-?\d{3,4}-?\d{4}|1[5-9]\d{2}-?\d{4})
            on-unsatisfied:
              message: 보내는 메시지 본문이 (광고)와 전송자의 명칭·전화번호로 시작하는 것을 코드에서 확인하지 못했습니다.
              ask-developer: 이 광고 메시지는 무엇으로 시작하나요? (광고) 바로 뒤에 회사명과 전화번호(또는 주소)가 붙나요?

          - id: ai-start-block
            # 이 정책의 AI 대안 다섯은 모두 "이 문구가 코드에 실제로 있는가"를 묻는다. 그래서 strict 다.
            # required 도 줄 전체가 주석인 인용은 받지 않지만 코드 줄 끝의 주석은 떼고 받는다. strict 는 그것도
            # 받지 않는다(픽스처 twilio-trailing-todo: TODO 주석에 적어 둔 '(광고) 회사명 전화번호'를 인용한 '예').
            ai:
              question: 이 광고 메시지(문자·앱 푸시·메신저)의 본문이 정확히 '(광고)'로 시작하고, 이어서 전송자의 명칭과 전화번호 또는 주소를 표시하는가? '(광 고)'나 '[광고]'처럼 다르게 쓴 표기, (광고)가 본문 중간이나 끝에 있는 경우는 해당하지 않는다. 본문 시작 부분을 만드는 줄을 인용하라.
              evidence: strict
            on-unsatisfied:
              message: (광고) 표기와 전송자의 명칭·연락처를 메시지 시작 부분에서 찾지 못했습니다.
              ask-developer: 광고 문구의 앞부분은 어디서 조립하나요? 문구가 코드 밖(CMS·발송 대행사 콘솔)에 있다면 그 문구를 확인해 주세요.
              remediation: 메시지 맨 앞에 (광고), 회사명, 전화번호(또는 주소)를 붙이세요. 표기는 빈칸이나 다른 괄호 없이 '(광고)'로 쓰세요.

      - id: nonemail-end-optout
        applies-when:
          - id: nonemail-send
            static: *nonemail-send
          - id: ad-intent
            static: *ad-intent

        applies-ai:
          question: 이 코드는 영리목적의 광고성 정보(할인·쿠폰·이벤트·신상품 홍보 등)를 문자·앱 푸시·메신저로 수신자에게 전송하는가? 주문·배송·결제·예약 확인, 리콜·보안 안내, 인증번호처럼 이미 맺은 거래를 이행하는 안내만 보내면 '아니오'라고 답하라.

        compliant-if-any:
          # 보내는 값이 '무료' 표시가 붙은 080 수신거부 번호로 끝나는지 본다(끝 부분). 1588 같은 번호는
          # 거는 쪽이 요금을 내므로 '무료'를 붙여도 ⑥ 에 맞는지 정적으로 알 수 없다. 080 만 정적으로 풀고,
          # 다른 번호와 전화를 갈음하는
          # 방식(앱 설정 경로·링크)은 AI 에 맡긴다. 설정 경로가 '쉽게 … 할 수 있는 방식'인지는 읽은
          # 원문으로 정해지지 않아 약한 정적 대안으로도 두지 않았다.
          # label-name-phone 과 같이 발송 호출에 넘긴 값만 본다. 변수 갈래는 뒤에 이어 붙이거나(+=)
          # 다시 대입한 변수를 받지 않는다. 그러면 끝 부분이 080 수신거부가 아닐 수 있다(쿠폰 줄을 += 로
          # 080 뒤에 붙인 문자).
          - id: optout-080-free
            static:
              patterns:
                - *in-send-call
                - *send-call-name
                - pattern-either:
                    - patterns:
                        - pattern: |
                            {..., $K: $MSG, ...}
                        - metavariable-regex:
                            metavariable: $K
                            regex: ^["']?(text|body|content)["']?$
                        - metavariable-regex:
                            metavariable: $MSG
                            regex: ^[\s\S]*(무료\s*(수신\s*)?(거부|철회|해지)|(수신\s*)?(거부|철회|해지)\s*[\(\[]?\s*무료\s*[\)\]]?)[\s:]*080-?\d{3,4}-?\d{4}(\s|\\n)*["'`]?$
                    - patterns:
                        - pattern-inside: |
                            $V = $MSG;
                            ...
                        - *not-reassigned
                        - pattern: |
                            {..., $K: $V, ...}
                        - metavariable-regex:
                            metavariable: $K
                            regex: ^["']?(text|body|content)["']?$
                        - metavariable-regex:
                            metavariable: $MSG
                            regex: ^[\s\S]*(무료\s*(수신\s*)?(거부|철회|해지)|(수신\s*)?(거부|철회|해지)\s*[\(\[]?\s*무료\s*[\)\]]?)[\s:]*080-?\d{3,4}-?\d{4}(\s|\\n)*["'`]?$
            on-unsatisfied:
              message: 보내는 메시지 본문 끝에서 '무료' 표시가 붙은 080 수신거부 번호를 확인하지 못했습니다.
              ask-developer: 수신거부 방법이 메시지 맨 끝에 붙나요? 거부할 때 수신자가 비용을 내지 않는다는 표시(예 무료거부)도 함께 있나요?

          - id: ai-optout-free
            # strict — ai-start-block 의 주석 참고
            ai:
              question: 이 광고 메시지(문자·앱 푸시·메신저)의 끝부분에 수신거부·수신동의 철회를 할 수 있는 전화번호나 전화를 갈음하는 쉬운 방법이 적혀 있고, 그 방법을 쓸 때 수신자가 비용을 부담하지 않는다는 표시(예 '무료')가 함께 있는가? 거는 사람이 전화요금을 내는 번호에 '무료'라고 붙인 경우는 해당하지 않는다. 해당 줄을 인용하라.
              evidence: strict
            on-unsatisfied:
              message: 메시지 끝 부분에서 무료 수신거부 방법을 찾지 못했습니다.
              ask-developer: 수신자가 이 광고를 비용 없이 거부하려면 어떻게 하나요? 그 안내가 메시지 맨 끝에 들어가나요?
              remediation: 메시지 맨 끝에 수신거부 번호나 방법을 적고, 수신자가 비용을 내지 않는다는 표시(예 무료거부 080-XXX-XXXX)를 함께 붙이세요.

      - id: email-subject-label
        applies-when:
          # nodemailer sendMail, Resend emails.send·batch.send, SES v3 Send*EmailCommand·v2 sendEmail,
          # Mailgun messages.create(도메인, {subject…}), SendGrid(기본·이름공간·require 로 들여온 모듈의
          # send·sendMultiple), sendEmail·sendMail 래퍼, 그리고 이름이 send 로 시작하는 호출에 제목과 함께
          # html 이나 template 을 넘기는 꼴(NestJS 메일 서비스 래퍼 등). subject 키만으로 이메일을 가리지
          # 않는다. Solapi LMS 도 subject 를 받는다.
          # 적용을 올리는 쪽이라 kr.network-act.50-3 의 전자우편 제외(send-call (가) 1)보다 넓다. 50-3 은
          # 모르면 적용으로 두므로 batch.send·제목+template 은 거기서 빼지 않는다.
          - id: email-send
            static: &email-send
              pattern-either:
                - pattern: $T.sendMail(...)
                - pattern: $R.emails.send(...)
                - pattern: $R.batch.send(...)
                - pattern: new SendEmailCommand(...)
                - pattern: new SendRawEmailCommand(...)
                - pattern: new SendTemplatedEmailCommand(...)
                - pattern: new SendBulkTemplatedEmailCommand(...)
                - pattern: new SendBulkEmailCommand(...)
                - pattern: $SES.sendEmail(...)
                - pattern: '$MG.messages.create($DOMAIN, {..., subject: $S, ...})'
                - patterns:
                    - pattern: $F(...)
                    - metavariable-regex:
                        metavariable: $F
                        regex: ^send(Mail|Email|EMail)$
                - patterns:
                    - pattern: '$M.$F({..., subject: $S, ..., $B: $H, ...})'
                    - metavariable-regex:
                        metavariable: $F
                        regex: ^send\w*$
                    - metavariable-regex:
                        metavariable: $B
                        regex: ^["']?(html|template)["']?$
                - patterns:
                    - pattern-either:
                        - pattern-inside: |
                            import $SG from "@sendgrid/mail";
                            ...
                        - pattern-inside: |
                            import * as $SG from "@sendgrid/mail";
                            ...
                        - pattern-inside: |
                            $SG = require("@sendgrid/mail");
                            ...
                    - pattern-either:
                        - pattern: $SG.send(...)
                        - pattern: $SG.sendMultiple(...)
          - id: ad-intent
            static: *ad-intent

        applies-ai:
          question: 이 코드는 영리목적의 광고성 정보(할인·쿠폰·이벤트·신상품 홍보 등)를 이메일로 수신자에게 전송하는가? 주문·배송·결제·예약 확인, 리콜·보안 안내, 인증번호처럼 이미 맺은 거래를 이행하는 안내만 보내면 '아니오'라고 답하라.

        compliant-if-any:
          # 제목 값(subject 키, 그 키에 넘긴 같은 구역의 변수, SES 의 Subject.Data)이 '(광고)'로 시작하는지.
          # 이름이 subject 로 끝나는 아무 변수가 아니라 실제로 subject 에 넘긴 값만 본다.
          - id: subject-label
            static:
              pattern-either:
                - patterns:
                    - pattern: |
                        {..., $K: $S, ...}
                    - metavariable-regex:
                        metavariable: $K
                        regex: ^["']?subject["']?$
                    - metavariable-regex:
                        metavariable: $S
                        regex: ^["'`]\(광고\)
                - patterns:
                    - pattern-inside: |
                        $V = $S;
                        ...
                    - pattern: |
                        {..., $K: $V, ...}
                    - metavariable-regex:
                        metavariable: $K
                        regex: ^["']?subject["']?$
                    - metavariable-regex:
                        metavariable: $S
                        regex: ^["'`]\(광고\)
                - patterns:
                    - pattern: |
                        {..., Subject: {..., Data: $S, ...}, ...}
                    - metavariable-regex:
                        metavariable: $S
                        regex: ^["'`]\(광고\)
            on-unsatisfied:
              message: 광고 메일 제목이 (광고)로 시작하는 것을 코드에서 확인하지 못했습니다.
              ask-developer: 이 광고 메일의 제목은 어떻게 만들어지나요? 맨 앞에 (광고)가 붙나요?

          - id: ai-subject-label
            # strict — ai-start-block 의 주석 참고
            ai:
              question: 이 광고 이메일의 제목이 정확히 '(광고)'로 시작하는가? (광고)가 제목 중간이나 끝에 있거나 다르게 쓴 표기는 해당하지 않는다. 제목을 만드는 줄(상수·헬퍼 포함)을 인용하라.
              evidence: strict
            on-unsatisfied:
              message: 메일 제목 시작 부분에서 (광고) 표기를 찾지 못했습니다.
              ask-developer: 제목에 (광고)를 붙이는 코드가 어디에 있나요?
              remediation: 광고 메일 제목 맨 앞에 (광고)를 붙이세요.

      - id: email-body-sender
        applies-when:
          - id: email-send
            static: *email-send
          - id: ad-intent
            static: *ad-intent

        applies-ai:
          question: 이 코드는 영리목적의 광고성 정보(할인·쿠폰·이벤트·신상품 홍보 등)를 이메일로 수신자에게 전송하는가? 주문·배송·결제·예약 확인, 리콜·보안 안내, 인증번호처럼 이미 맺은 거래를 이행하는 안내만 보내면 '아니오'라고 답하라.

        compliant-if-any:
          # 약하다(혼자 풀지 못하고 AI 가 다시 본다). 한 문자열에 이메일 주소·전화번호·주소 모양이 함께
          # 있는지만 본다. 명칭이 있는지, 그 정보가 전송자의 것인지는 보지 못한다.
          - id: body-sender-info
            strength: weak
            static:
              patterns:
                - pattern: $MSG
                - metavariable-regex:
                    metavariable: $MSG
                    regex: ^["'`](?=[\s\S]*[\w.+-]+@[\w-]+\.[\w.]+)(?=[\s\S]*(0\d{1,2}-\d{3,4}-\d{4}|1[5-9]\d{2}-\d{4}))(?=[\s\S]*(특별시|광역시|[가-힣]+[시도군구]\s+[가-힣0-9]+[로길동읍면]))
            on-unsatisfied:
              message: 메일 본문에서 전송자의 전자우편주소·전화번호·주소를 함께 찾지 못했습니다.
              ask-developer: 광고 메일 본문에 회사명, 이메일 주소, 전화번호, 주소가 모두 들어가나요?

          - id: ai-body-sender
            # strict — ai-start-block 의 주석 참고
            ai:
              question: 이 광고 이메일의 본문에 전송자의 명칭, 전자우편주소, 전화번호, 주소가 모두 표시되는가? 네 가지 중 하나라도 빠지면 '아니오'다. 그 내용을 담은 줄을 인용하라.
              evidence: strict
            on-unsatisfied:
              message: 본문에 전송자의 명칭·전자우편주소·전화번호·주소가 모두 있는지 확인하지 못했습니다.
              ask-developer: 메일 하단(푸터) 템플릿은 어디에 있나요? 명칭·이메일 주소·전화번호·주소가 모두 들어가나요?
              remediation: 광고 메일 본문에 전송자의 명칭, 전자우편주소, 전화번호, 주소를 모두 넣으세요.

      - id: email-body-optout
        applies-when:
          - id: email-send
            static: *email-send
          - id: ad-intent
            static: *ad-intent

        applies-ai:
          question: 이 코드는 영리목적의 광고성 정보(할인·쿠폰·이벤트·신상품 홍보 등)를 이메일로 수신자에게 전송하는가? 주문·배송·결제·예약 확인, 리콜·보안 안내, 인증번호처럼 이미 맺은 거래를 이행하는 안내만 보내면 '아니오'라고 답하라.

        compliant-if-any:
          # 약하다. 한 문자열에 한글 수신거부 안내, 영문 unsubscribe·opt-out(낱말 단위), 링크가 함께
          # 있는지만 본다. 낱말 경계가 있어야 `${unsubscribeUrl}` 이 영문 안내로 세지지 않는다.
          # 안내문이 충분한지, 링크가 간편하게 거부를 고르게 하는지는 보지 못한다.
          - id: body-optout-ko-en
            strength: weak
            static:
              patterns:
                - pattern: $MSG
                - metavariable-regex:
                    metavariable: $MSG
                    regex: ^["'`](?=[\s\S]*(수신\s*거부|수신\s*동의\s*철회))(?=[\s\S]*(?i:\bunsubscribe\b|\bopt[\s-]?out\b))(?=[\s\S]*(href=|https?://))
            on-unsatisfied:
              message: 메일 본문에서 한글·영문 수신거부 안내와 거부 링크를 함께 찾지 못했습니다.
              ask-developer: 수신거부 안내와 거부 링크가 한글과 영문으로 모두 있나요?

          - id: ai-body-optout
            # strict — ai-start-block 의 주석 참고
            ai:
              question: 이 광고 이메일의 본문에 수신거부·수신동의 철회 의사를 쉽게 표시할 수 있도록 하는 안내문과, 거부 여부를 간편하게 선택할 수 있는 기술적 조치(링크·버튼 등)가 있고, 그 안내문과 기술적 조치가 한글과 영문으로 모두 명시되어 있는가? 해당 줄을 인용하라.
              evidence: strict
            on-unsatisfied:
              message: 한글·영문으로 명시된 수신거부 안내문과 간편한 거부 수단을 확인하지 못했습니다.
              ask-developer: 수신거부 안내문과 거부 링크가 한글과 영문으로 모두 있나요? 거부할 때 수신자의 연락처 외의 정보를 요구하지는 않나요?
              remediation: 광고 메일 본문에 수신거부 안내문과 수신거부를 간편하게 고를 수 있는 링크를 한글과 영문으로 함께 두세요.
