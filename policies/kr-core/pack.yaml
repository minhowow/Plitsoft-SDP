          law-id: '000030'
        # ⑥ 수신거부·철회에 드는 전화요금 등의 금전적 비용을 수신자가 부담하지 않도록 할 의무.
        # 규칙 nonemail-end-optout 의 '무료' 표시가 여기와 시행령 제62조·별표 6 에서 나온다.
        - statute: 정보통신망 이용촉진 및 정보보호 등에 관한 법률
          article: 제50조
          clause: 제6항
          url: https://www.law.go.kr/법령/정보통신망이용촉진및정보보호등에관한법률
          text-file: _legal/network-act-50.txt
          text-sha256: b54539a223fa635fa66c98a6098f388aff45755a268ebb402533a5245ea1394c
          text-retrieved: '2026-09-22'
          effective-from: '2026-09-11'
          law-id: '000030'
        # 시행령 제61조 ③ 이 명시사항과 방법을 별표 6 에 맡긴다. 별표 6 은 조문 단위로 받을 수 없어
        # 해시로 고정하지 못한다. 규칙 다섯 개는 별표 6 의 칸을 하나씩 옮긴 것이다.
        # 별표 6 의 출처: 국가법령정보 Open API 의 별표내용(시행 2026-07-07 판본, MST 288033). 받은 글은 태그
        # archive/research-2026-09-29 의 docs/alternatives/c4-ad-disclosure/README.md 2.3 에 있다. 띄어쓰기
        # 일부가 추정이라 공식 별표와 대조한 뒤에야 고정할 수 있다.
        #   그 밖의 전자적 전송매체, 2. 음성 외의 형태 (문자·앱 푸시·메신저)
        #     가. 시작 부분에 (광고), 전송자의 명칭과 전화번호 또는 주소  → nonemail-start-block
        #     나. 끝 부분에 수신거부·철회용 전화번호 또는 전화를 갈음하는 쉬운 방식,
        #         그리고 수신자가 비용을 부담하지 않는다는 것          → nonemail-end-optout
        #   전자우편
        #     1. 제목이 시작되는 부분에 (광고)                          → email-subject-label
        #     2.가 본문에 명칭·전자우편주소·전화번호 및 주소            → email-body-sender
        #     2.나 본문에 수신거부·철회 안내문과 간편한 기술적 조치, 한글과 영문으로 → email-body-optout
        # 음성 형태로 전송되는 광고(그 밖의 전자적 전송매체 1)는 모델링하지 않았다(JS/TS 웹 코드에서 드물다).
        - statute: 정보통신망 이용촉진 및 정보보호 등에 관한 법률 시행령
          article: 제61조
          clause: 제3항
          url: https://www.law.go.kr/법령/정보통신망이용촉진및정보보호등에관한법률시행령
          text-file: _legal/network-act-decree-61.txt
          text-sha256: aea5f6c682c613549e828e75e516144d9abe6fdf1c149634ea74b3976213584d
          text-retrieved: '2026-09-22'
