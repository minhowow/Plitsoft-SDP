[project]
name = "policypack"
version = "0.3.0.dev0"
description = "국내 법·정책 관점에서 코드를 검토하는 정책 팩 해석기"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"

dependencies = [
    # 정적 백엔드. 휠에 OCaml 엔진이 동봉돼 있어 이 한 줄로 해결된다.
    # 마이너 버전을 고정한다 — 파서와 매치 동작이 판마다 달라 같은 팩의 판정이 바뀔 수 있다.
    "semgrep==1.176.*",
    # 정책 팩 모델과 JSON Schema 생성
    "pydantic>=2.9",
    # YAML 1.2. pyyaml(1.1)은 yes/no/on/off 를 bool 로 강제변환해서 못 쓴다.
    "ruamel.yaml>=0.18",
]

[project.scripts]
policypack = "policypack.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/policypack"]

# 정책 팩을 휠에 싣는다. pre-commit 훅처럼 사용자 저장소에서 돌 때
# 그 저장소에는 policies/ 가 없으므로, 기본값을 패키지 안에서 찾아야 한다.
[tool.hatch.build.targets.wheel.force-include]
"policies/kr-core" = "policypack/_bundled/policies/kr-core"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# 판정자에게 보내는 프롬프트는 원문 그대로 유지한다. 줄을 자르면 모델 입력이 달라진다.
"src/policypack/judge/base.py" = ["E501"]
"src/policypack/review/prompts.py" = ["E501"]
