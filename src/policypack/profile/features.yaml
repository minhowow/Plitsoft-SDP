  - id: genai
    # 고영향 AI·자동화 결정 의무도 이 기능에 붙어 있다(목록 층). 분류·인식 모델만 쓰면 ai-model 이다
    name: 생성형 AI(LLM·생성 API 호출)
    signals:
      packages: [openai, "@anthropic-ai/sdk", "@google/generative-ai", "@google/genai", langchain, "@langchain/", ai,
                 "@ai-sdk/", replicate, "@huggingface/inference", cohere-ai, ollama, "@mistralai/mistralai", groq-sdk]
      paths: [ai, chatbot, gpt, llm]
      calls: [chat.completions.create, responses.create, generateContent]
      urls: [api.openai.com, api.anthropic.com, generativelanguage.googleapis.com]
    scope_notes: [생성형 AI, 고영향 AI, AI 합성물, AI 가상인물, 아동 챗봇, 자동화 결정, AI 음성·얼굴, 얼굴 합성]
    whenever: [aiact-31-1, aiact-31-2]
    generative: [aiact-31-1, aiact-31-2]

  - id: ai-model
    # 붙는 의무가 없다. 이것만 있으면 generative 의무를 '해당 여부부터'로 싣는다
    name: 그 밖의 AI(분류·인식 모델)
    signals:
      packages: ["@tensorflow/", "@tensorflow-models/", "@teachablemachine/", "@mediapipe/", face-api.js,
                 "@vladmandic/face-api", ml5, onnxruntime-web, onnxruntime-node, onnxruntime-react-native, tesseract.js,
                 brain.js]
      calls: [tmPose.load, tmImage.load, tf.loadLayersModel, tf.loadGraphModel]

  - id: external-transfer
    name: 외부 업체·국외로 개인정보 전송(외부 AI 포함)
    signals:
      packages: [openai, "@anthropic-ai/sdk", "@google/generative-ai", "@google/genai", "@ai-sdk/", "@sentry/",
                 mixpanel-browser, "@amplitude/", amplitude-js, posthog-js, "@datadog/", logrocket, "@hotjar/",
                 "@sendgrid/mail", twilio, "@channel.io/", firebase, "@supabase/supabase-js", "@aws-sdk/", aws-sdk]
      urls: [api.openai.com, api.anthropic.com, generativelanguage.googleapis.com]
    scope_notes: [국외이전 동의]
    duties: [pipa-17-1, pipa-17-2, pipa-stdguide-7-3, pipa-26-2, pipa-28-8-1]

  - id: analytics
    name: 분석·추적·데이터 활용
