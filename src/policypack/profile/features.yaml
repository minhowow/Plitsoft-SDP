# 프로필이 알아보는 서비스 기능과, 의무 지도의 의무를 기능에 붙이는 규칙.
#
# signals — 코드에서 기능을 알아보는 신호. 모두 설명할 수 있는 것만 쓴다(글자 맞추기 정규식을 쓰지 않는다).
#   packages  package.json 의 dependencies(devDependencies 는 빼고)와 소스의 import·require 에 나온 npm 이름.
#             '/' 로 끝나면 그 범위(@tosspayments/ 등)의 모든 꾸러미다
#   paths     경로(폴더·파일 이름)를 낱말로 나눈 것 가운데 하나, 또는 붙은 두 낱말을 이은 것
#             (SignUpScreen.tsx → sign·up·screen, signup). 낱말이 같아야 맞는다(border 는 order 가 아니다).
#             뜻이 갈리는 낱말은 쓰지 않는다: map(RoadMap·MindMap), chat(AI 챗봇), job(배치 작업), message(오류 문구),
#             post(HTTP POST), review(코드 검토), ticket(표 모양 화면), video(화상 통화), doctor(점검 명령),
#             prompt(확인 대화상자)
#   calls     소스의 코드에 글자 그대로 있는 호출 모양(앞뒤가 식별자 글자가 아닐 때). 문자열·주석 안의 글자는 세지 않는다
#   urls      문자열이 그 주소로 시작할 때(fetch("https://api.openai.com/…")). 문장 속에 나온 주소는 세지 않는다
#   screens   화면 파일(JSX·TSX 를 그리는 파일, index/roles.py 의 screen)이 하나라도 있으면 맞는다. 저장소가 웹이 아니면
#             (모바일 앱 틀만 있으면) 세지 않는다(profile.platforms)
# 시험·픽스처·설정 파일(index/roles.py 의 test·config)의 신호는 기능으로 세지 않고 따로 낸다.
#
# 의무 붙이기 — 의무 지도의 의무(코드에 흔적이 남는 795개)마다 하나의 기능 또는 아래 두 묶음 가운데 하나에 붙는다.
#   scope 가 sector 인 의무는 모두 '지위'(공공기관·금융회사 등 주체의 지위로 걸리는 의무)다
#   그 밖은 duties(의무 id)가 먼저, 다음이 scope_notes(의무 지도의 scope_note) 다
# 표는 scripts/lawmap_table.py 가 만든다(src/policypack/profile/duties.jsonl).
#
# whenever — 그 기능이 있으면 걸리는 의무(걸리는 조건이 곧 기능이다. 가입을 받으면 약관 고지, 위치를 모으면 철회 시 파기).
#   review 는 이 의무에 '해당 없음'을 받지 않는다. 기능이 있는데 지킨 처리가 보이지 않으면 '코드에서 본 것'이다
#   (11/12 실측: 약관이 아예 없다, 탈퇴 경로가 아예 없다를 '해당 없음'으로 읽었다).
#
# audience — 이용자가 누구인지(14세 미만 아동, 미성년자, 청소년)에 걸리는 의무. 나이·본인·지역을 확인하는 장치가 없다는
#   것은 그런 이용자가 없다는 증명이 아니다. review 는 이 의무에 '해당 없음'을 받지 않고 '해당 여부부터 확인할 것'으로
#   둔다(11/12 재실행: 나이 확인이 없는 가입을 '아동 동의 해당 없음'으로 읽었다). 목록 밖의 의무도 답이 '확인 장치 없음'을
#   근거로 들면 같다.
#
# goods — 특정 품목을 팔 때만 걸리는 의무. 그 품목의 신호(paths, 그리고 서비스 소스의 글에 그대로 있는 낱말 words)가
#   없으면 묻지 않고 체크리스트의 '해당 여부부터 확인할 것' 맨 뒤에 한 묶음(group: goods)으로 싣는다. 신호가 있으면 기능
#   안에서 맨 뒤에 묻는다(11/12 실측: 상한에 걸린 POS 가 농산물 원산지를 묻고 탈퇴·해지는 묻지 못했다).
#
# generative — 생성형 AI 신호가 있을 때만 묻는 의무(AI 사전 고지·결과물 표시). 생성형 신호는 genai 신호 가운데 꾸러미·
#   import·호출·주소, 내장 팩의 정적 검사, 그리고 그 신호와 같은 글자(호출·주소·꾸러미 이름)가 있는 이해 단계의 인용이다.
#   경로 낱말(ai·gpt 등)과 이해 단계의 말만으로는 생성형이 아니다. 생성형 신호 없이 AI 기능(genai)이나 그 밖의 AI(ai-model)만
#   있으면 묻지 않고 '해당 여부부터 확인할 것'으로 싣는다(11/13 실측: 포즈 분류 모델을 'AI 기능'으로 보고 생성형 AI 결과물
#   표시를 '코드에서 본 것'으로 고정했다).
#
# sides — 화면이 하는 의무(screen: 고지·동의 화면·표시·게시)와 서버가 하는 의무(server: 저장·암호화·접근 제한·기록·파기).
#   저장소가 서버만 또는 화면만이면(profile 의 platforms 와 다른 언어의 서버 파일로 가른다), 반대쪽이 하는 의무는 이 저장소에
#   지킨 처리가 없어도 '코드에서 본 것'이 아니라 '저장소 밖에서 확인할 것'이다(11/13 실측: 앱 서버 저장소에서 약관 고지·동의
#   고지를 '코드에서 본 것'으로 뒀다). 양쪽이 함께 하는 의무(전송 암호화, 공개 설정 등)는 넣지 않는다.
#
# prohibitions — 금지 의무("~하지 말 것": 기만 표시, 철회 방해 문구, 위약금 청구 등). 금지된 행위 자체를 인용할 때만
#   '코드에서 본 것'이다. 막는 장치·안내가 없다는 것은 근거가 아니다. 금지된 행위를 찾지 못하면 '걸리지 않는 것으로 보임'
#   (검색이 맞으면 '해당 없음')이다(11/13 실측: 가짜 마감 타이머·'반품 불가' 문구를 찾지 못하고도 "막는 장치가 없다"며
#   '코드에서 본 것'으로 뒀다). 그 기능이 있으면 걸리는 의무(whenever)와 겹치지 않는다. 표(duties.jsonl)의 prohibition 이다.

