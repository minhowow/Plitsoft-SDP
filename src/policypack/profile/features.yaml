                 react-facebook-pixel, "@analytics/"]
      paths: [analytics, tracking]
      calls: [gtag, fbq, dataLayer.push]
      # 분석 스크립트는 흔히 문자열(인라인 스크립트)로 넣는다. 그 스크립트를 내려받는 주소로 센다
      urls: [www.googletagmanager.com, googletagmanager.com, www.google-analytics.com, connect.facebook.net]
