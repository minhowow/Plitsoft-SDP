# GitLab CI 에서 저장소의 JS/TS 코드를 검사해 Code Quality 보고서로 올린다. .gitlab-ci.yml 에 붙여 넣고 설치 줄을 채운다.
# 정적 조건만 쓴다(AI 호출 0회, 코드가 밖으로 나가지 않음).
#
# 무료 판(Free)에서는 머지 요청 화면의 Code Quality 보고서에 새로 생긴 경고·사라진 경고가 나온다. 바뀐 줄 옆 표시는
# Ultimate, 파이프라인 화면의 보고서 탭은 Premium 이상이다. GitLab 은 대상 가지(기본 가지)의 마지막 파이프라인 보고서와
# 견줘 "새 경고"를 고르므로, 기본 가지에서도 돌리고 머지 요청과 같은 범위(저장소 전체)를 검사한다. --diff 로 바뀐 파일만
# 검사하면 바뀌지 않은 파일의 경고가 모두 "사라진 경고"로 보인다.
policypack:
  stage: test
  image: python:3.12-slim          # glibc 2.36. semgrep 엔진은 glibc 2.34 이상이 필요하다(Alpine 이면 musl 1.2)
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - pip install -q uv
    # PyPI 에 올리기 전에는 이름만으로 설치하지 않는다. 아직 등록되지 않은 이름을 남이 먼저 등록할 수 있다.
    # 저장소에서 설치하려면 git 이 필요하다(apt-get install -y git). 저장소에 넣어 둔 휠이면 그 경로를 준다.
    - uv tool install -q "<설치할 것: git+<이 저장소 URL>@<태그> 또는 휠 파일 경로>"
    - export PATH="$HOME/.local/bin:$PATH"
  script:
    - policypack scan . --output-format gitlab > gl-code-quality-report.json
  # 1 = 사람이 볼 것이 있음(경고). 2 = 도구 오류라 파이프라인을 멈춘다
  allow_failure:
    exit_codes: [1]
  artifacts:
    when: always
    reports:
      codequality: gl-code-quality-report.json
